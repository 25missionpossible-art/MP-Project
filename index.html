<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fina &amp; Unzi Wedding Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap">
<script>window.FU_STANDALONE = true;</script>
<style>
[hidden]{display:none!important}
/* Layout: fixed left sidebar (desktop) / top bar + slide-in drawer (mobile); main column max 1320px.
   Single light "garden white" theme by choice: every color is set explicitly below. */
:root{
  --forest:#244C3A; --emerald:#3F7657; --sage:#A8BFA5; --mint:#E8F0E7;
  --white:#FFFFFF; --warm:#FAFAF7; --ink:#202020; --pink:#F3DDE5; --pink2:#E8C4D1;
  --pink-ink:#9A4A67; --muted:#5B6660; --faint:#8A948E; --line:#E2E7E1; --line2:#EEF1EC;
  --ok:#2E7D4F; --ok-bg:#E3F1E8; --warn:#9A5B06; --warn-bg:#FBF0DC; --bad:#B3261E; --bad-bg:#FBE6E4;
  --info:#2F5F97; --info-bg:#E4ECF6;
  --display:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --body:"Manrope","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --r:10px; --r-sm:7px;
  --shadow:0 1px 2px rgba(32,32,32,.05),0 4px 16px rgba(36,76,58,.05);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--warm);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--emerald)}
:focus-visible{outline:2px solid var(--emerald);outline-offset:2px}
.num,td.money,.money{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Lock screen ---------- */
.lock{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:
  radial-gradient(1200px 500px at 50% -10%,var(--mint),transparent 70%),var(--warm)}
.lock-card{width:100%;max-width:420px;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:36px 28px;text-align:center;box-shadow:var(--shadow)}
.mono{font-family:var(--display);font-style:italic;font-weight:500;color:var(--forest);font-size:22px;letter-spacing:.02em;width:64px;height:64px;border-radius:50%;border:1px solid var(--sage);display:grid;place-items:center;margin:0 auto 14px}
.lock h1{font-family:var(--display);font-weight:500;font-size:44px;line-height:1.05;color:var(--forest)}
.lock h1 em{color:var(--pink-ink);font-style:italic}
.lock .sub{color:var(--muted);margin:8px 0 24px;font-size:14px}
.lock form{display:grid;gap:12px;text-align:left}
.lock .err{color:var(--bad);font-size:13px;min-height:18px}
.profiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.profile-btn{border:1.5px solid var(--line);background:var(--white);border-radius:14px;padding:20px 10px;cursor:pointer;display:grid;gap:8px;justify-items:center;transition:border-color .15s,transform .15s}
.profile-btn:hover{transform:translateY(-1px)}
.profile-btn .av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:20px}
.profile-btn.fina .av{background:var(--pink);color:var(--pink-ink)}
.profile-btn.fina:hover{border-color:var(--pink2)}
.profile-btn.unzi .av{background:var(--ink);color:var(--white)}
.profile-btn.unzi:hover{border-color:var(--ink)}
.profile-btn b{font-size:16px}
.profile-btn small{color:var(--muted)}
.lock .fine{font-size:12px;color:var(--faint);margin-top:18px;line-height:1.5}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
.side{background:var(--white);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 12px;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px}
.brand .mono{width:40px;height:40px;font-size:15px;margin:0}
.brand b{font-family:var(--display);font-size:22px;font-weight:600;color:var(--forest);line-height:1}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.nav{display:grid;gap:2px}
.nav-group{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:14px 10px 6px;font-weight:600}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500;font-size:14px;text-align:left}
.nav button svg{width:18px;height:18px;flex:none}
.nav button:hover{background:var(--mint);color:var(--forest)}
.nav button.active{background:var(--forest);color:var(--white)}
.nav button .count{margin-left:auto;font-size:11px;background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:1px 7px;font-weight:700}
.nav button.active .count{background:rgba(255,255,255,.18);color:var(--white)}
.side-foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--line2);font-size:12px;color:var(--muted);display:grid;gap:8px}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(250,250,247,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 28px;min-height:60px}
.topbar .menu-btn{display:none}
.topbar h2{font-size:17px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.save-state{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.save-state .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.save-state.saving .dot{background:var(--warn);animation:pulse 1s infinite}
.save-state.error{color:var(--bad);font-weight:600}
.save-state.error .dot{background:var(--bad)}
.save-state.loading .dot{background:var(--sage);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.who{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--white);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;font-weight:600;font-size:13px}
.who .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.who.fina{border-color:var(--pink2)} .who.fina .av{background:var(--pink);color:var(--pink-ink)}
.who.unzi{border-color:#9a9a9a} .who.unzi .av{background:var(--ink);color:var(--white)}
.content{padding:24px 28px 60px;max-width:1320px;width:100%;margin:0 auto;display:grid;gap:20px}
.mode-banner{font-size:13px;border-radius:var(--r-sm);padding:10px 14px;background:var(--warn-bg);color:var(--warn);border:1px solid #F0D9B0}

/* ---------- Primitives ---------- */
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.card h3{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.card .hint{color:var(--muted);font-size:12.5px;margin-top:2px}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--white);color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:600;font-size:13.5px;cursor:pointer;min-height:38px;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn:hover{border-color:var(--sage);background:var(--mint)}
.btn.primary{background:var(--forest);border-color:var(--forest);color:var(--white)}
.btn.primary:hover{background:var(--emerald);border-color:var(--emerald)}
.btn.danger{color:var(--bad);border-color:#F0C9C5}
.btn.danger:hover{background:var(--bad-bg)}
.btn.danger.solid{background:var(--bad);color:var(--white);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--mint)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:12.5px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.icon-btn{border:0;background:none;padding:6px;border-radius:6px;cursor:pointer;color:var(--muted);display:inline-grid;place-items:center;min-width:32px;min-height:32px}
.icon-btn:hover{background:var(--mint);color:var(--forest)}
.icon-btn svg{width:17px;height:17px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.muted{color:var(--muted)} .small{font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--line2);color:var(--muted)}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.info{background:var(--info-bg);color:var(--info)}
.pill.green{background:var(--mint);color:var(--forest)}
.pill.fina{background:var(--pink);color:var(--pink-ink)} .pill.unzi{background:var(--ink);color:var(--white)}
.pill.both{background:linear-gradient(90deg,var(--pink) 50%,#3a3a3a 50%);color:var(--white);text-shadow:0 0 2px rgba(0,0,0,.5)}
.pill.prio-Critical{background:var(--bad);color:#fff} .pill.prio-High{background:var(--bad-bg);color:var(--bad)}
.pill.prio-Medium{background:var(--warn-bg);color:var(--warn)} .pill.prio-Low{background:var(--line2);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--white);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;font-weight:500;white-space:nowrap}
.chip:hover{border-color:var(--sage)}
.chip.on{background:var(--forest);color:var(--white);border-color:var(--forest)}
.chip .x{opacity:.8;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;padding:34px 16px;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty svg{width:34px;height:34px;color:var(--sage)}
.empty b{color:var(--ink);font-size:15px}
.bar{height:8px;border-radius:6px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--emerald);border-radius:6px}
.bar.pink i{background:var(--pink-ink)}
.warnbox{border-radius:var(--r-sm);padding:10px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.warnbox.warn{background:var(--warn-bg);color:var(--warn)} .warnbox.bad{background:var(--bad-bg);color:var(--bad)}
.warnbox.ok{background:var(--ok-bg);color:var(--ok)} .warnbox.info{background:var(--mint);color:var(--forest)}
.warnbox svg{width:18px;height:18px;flex:none;margin-top:1px}

/* ---------- Forms ---------- */
.field{display:grid;gap:5px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field label .req{color:var(--bad)}
.input,select.input,textarea.input{width:100%;border:1px solid #D5DCD4;background:var(--white);border-radius:8px;padding:9px 11px;font-size:14.5px;min-height:40px}
textarea.input{min-height:78px;resize:vertical}
.input:focus{border-color:var(--emerald);outline:2px solid rgba(63,118,87,.18);outline-offset:0}
.input.invalid{border-color:var(--bad)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}
.form-sec{grid-column:1/-1;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--forest);font-weight:700;padding-top:8px;border-top:1px solid var(--line2);margin-top:4px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--forest)}
.search{position:relative;min-width:200px;flex:1;max-width:340px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--faint)}
.search .input{padding-left:34px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar select.input{width:auto;min-width:130px}
.derived{background:var(--warm);border:1px dashed var(--line);border-radius:8px;padding:9px 11px;font-variant-numeric:tabular-nums;min-height:40px;font-size:14px}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--white)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-weight:700;font-size:12px;color:var(--muted);background:var(--warm);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;cursor:pointer;user-select:none}
table.t th.nosort{cursor:default}
table.t th .arr{opacity:.4;margin-left:3px}
table.t th.sorted .arr{opacity:1;color:var(--forest)}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr{cursor:pointer}
table.t tbody tr:hover td{background:#F6F9F5}
table.t td.money,table.t th.money{text-align:right;white-space:nowrap}
table.t tr.overdue td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
table.t tr.soon td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
table.t tr.done td{color:var(--faint)}
table.t tr.done td .title{text-decoration:line-through}
table.t tfoot td{font-weight:700;background:var(--warm);border-top:1px solid var(--line)}
td .title{font-weight:600;color:var(--ink)}
td .sub{font-size:12px;color:var(--muted)}
.inline-select{border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 6px;font-size:13px;cursor:pointer;max-width:140px}
.inline-select:hover{border-color:var(--line);background:var(--white)}
.neg{color:var(--bad)} .pos{color:var(--ok)}
.tcount{font-size:12.5px;color:var(--muted)}

/* ---------- Dashboard ---------- */
.hero{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:26px 28px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:1px solid var(--mint);box-shadow:0 0 0 22px var(--warm),0 0 0 23px var(--mint);pointer-events:none}
.hero>*{position:relative;z-index:1}
.hero .eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--emerald);font-weight:700}
.hero h1{font-family:var(--display);font-weight:500;font-size:clamp(40px,6vw,60px);line-height:1;color:var(--forest);margin:6px 0 8px}
.hero h1 .amp{font-style:italic;color:var(--pink-ink);padding:0 .08em}
.hero .meta{color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
.hero .meta span{display:inline-flex;gap:6px;align-items:center}
.hero .meta svg{width:15px;height:15px}
.count-box{text-align:center;position:relative;z-index:1;padding:8px 18px}
.count-box .n{font-family:var(--display);font-size:64px;line-height:1;color:var(--forest);font-weight:600;font-variant-numeric:lining-nums tabular-nums}
.count-box .l{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px;min-width:0;cursor:pointer;text-align:left}
.kpi:hover{border-color:var(--sage)}
.kpi .k{font-size:12px;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center}
.kpi .k svg{width:14px;height:14px;color:var(--emerald)}
.kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.alert .v{color:var(--bad)}
.filterbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:10}
.filterbar .lbl{font-size:12.5px;color:var(--muted);font-weight:600}
.charts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.chart-card{display:flex;flex-direction:column}
.chart-card .cv{position:relative;height:240px;margin-top:8px}
.chart-card.wide{grid-column:span 2}
.chart-card.full{grid-column:1/-1}
.chart-card .cv.tall{height:280px}
.chart-empty{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center;text-align:center;color:var(--faint);font-size:13px;padding:20px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12.5px}
.legend button{border:0;background:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer;padding:2px 0;color:var(--ink)}
.legend button.dim{opacity:.4}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.prio-list{display:grid;gap:2px;grid-template-columns:minmax(0,1fr)}
.prio-item{min-width:0;display:flex;gap:10px;align-items:center;padding:9px 8px;border-radius:8px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.prio-item:hover{background:var(--mint)}
.prio-item .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.prio-item .ic svg{width:16px;height:16px}
.prio-item .ic.bad{background:var(--bad-bg);color:var(--bad)} .prio-item .ic.warn{background:var(--warn-bg);color:var(--warn)}
.prio-item .ic.info{background:var(--mint);color:var(--forest)}
.prio-item .tx{min-width:0;flex:1}
.prio-item .tx b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prio-item .tx small{color:var(--muted);font-size:12px}
.prog-row{display:grid;grid-template-columns:130px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px;padding:4px 0}
.prog-row .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.ring{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--emerald) calc(var(--p)*1%),var(--line2) 0);display:grid;place-items:center;flex:none}
.ring>div{width:94px;height:94px;border-radius:50%;background:var(--white);display:grid;place-items:center;text-align:center}
.ring b{font-size:24px;font-variant-numeric:tabular-nums}
.ring small{display:block;font-size:11px;color:var(--muted)}
.focus-panel{border-color:var(--emerald);box-shadow:0 0 0 3px var(--mint)}

/* ---------- Timeline ---------- */
.tl{display:grid;gap:0;position:relative}
.tl-phase{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;position:relative;padding-bottom:18px}
.tl-phase:before{content:"";position:absolute;left:150px;margin-left:-9px;top:6px;bottom:0;width:1px;background:var(--line)}
.tl-when{text-align:right;padding-right:22px;position:relative}
.tl-when b{display:block;font-size:15px;color:var(--forest)}
.tl-when small{color:var(--muted);font-size:12px}
.tl-when:after{content:"";position:absolute;right:-5px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--white);border:2px solid var(--emerald)}
.tl-phase.past .tl-when:after{background:var(--emerald)}
.tl-phase.now .tl-when:after{background:var(--pink-ink);border-color:var(--pink-ink);box-shadow:0 0 0 4px var(--pink)}
.tl-items{display:grid;gap:6px;min-width:0}
.tl-item{display:flex;gap:10px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;min-width:0}
.tl-item:hover{border-color:var(--sage)}
.tl-item .tx{flex:1;min-width:0}
.tl-item .tx b{font-weight:600;font-size:13.5px;display:block}
.tl-item .tx small{color:var(--muted);font-size:12px}
.tl-item.done .tx b{text-decoration:line-through;color:var(--faint)}
.tl-item.overdue{border-color:#EFC2BE;background:#FFF8F7}
.tick{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--sage);background:var(--white);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.tick svg{width:14px;height:14px;color:var(--white)}
.tick.on{background:var(--emerald);border-color:var(--emerald)}

/* ---------- Vendors compare ---------- */
.compare{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:14px;overflow-x:auto;padding-bottom:6px}
.vcard{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start}
.vcard.booked{border-color:var(--emerald);box-shadow:0 0 0 2px var(--mint)}
.vcard.selected{border-color:var(--pink2)}
.vcard h4{margin:0;font-size:16px}
.vcard dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px}
.vcard dt{color:var(--muted)} .vcard dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.vcard .pros,.vcard .cons{font-size:13px;border-radius:6px;padding:7px 9px;white-space:pre-wrap}
.vcard .pros{background:var(--ok-bg)} .vcard .cons{background:var(--bad-bg)}

/* ---------- Moodboard ---------- */
.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.board{border:1px solid var(--line);border-radius:12px;background:var(--white);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;padding:0}
.board:hover{border-color:var(--sage)}
.board .cov{aspect-ratio:4/3;display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:2px;background:var(--mint);max-width:100%}
.board .cov .ph{background:var(--mint) center/cover no-repeat}
.board .cov .ph:first-child{grid-row:1/3}
.board .cov.one .ph:first-child{grid-column:1/3}
.board .cov .blank{grid-column:1/3;grid-row:1/3;display:grid;place-items:center;color:var(--sage)}
.board .cov .blank svg{width:36px;height:36px}
.board .bt{padding:12px 14px}
.board .bt b{display:block;font-size:14.5px}
.board .bt small{color:var(--muted)}
.masonry{columns:4 220px;column-gap:14px}
.pin{break-inside:avoid;margin-bottom:14px;background:var(--white);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
.pin img{display:block;width:100%;height:auto;cursor:zoom-in;background:var(--mint);min-height:80px}
.pin .linkcard{padding:22px 14px;background:var(--mint);font-size:13px;display:grid;gap:6px;overflow-wrap:anywhere}
.pin .pc{padding:10px 12px;display:grid;gap:2px}
.pin .pc b{font-size:13.5px}
.pin .pc small{color:var(--muted);font-size:12px;white-space:pre-wrap}
.pin .acts{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transition:opacity .15s}
.pin:hover .acts,.pin:focus-within .acts{opacity:1}
.pin .acts button{background:rgba(255,255,255,.94);border:0;border-radius:7px;width:32px;height:32px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.pin .acts button svg{width:16px;height:16px}
.pin .fav{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.94);border-radius:50%;width:30px;height:30px;display:grid;place-items:center;color:var(--pink-ink)}
.pin .fav svg{width:16px;height:16px;fill:currentColor}
.pin.dragging{opacity:.4}
.pin.drop-target{outline:2px dashed var(--emerald)}
.dropzone{border:1.5px dashed var(--sage);border-radius:12px;padding:22px;text-align:center;color:var(--muted);background:var(--white)}
.dropzone.over{background:var(--mint);border-color:var(--emerald)}
.lightbox{position:fixed;inset:0;background:rgba(18,26,22,.92);z-index:100;display:grid;grid-template-rows:1fr auto;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.lightbox .stage{display:grid;place-items:center;min-height:0;position:relative}
.lightbox img{max-width:100%;max-height:calc(100vh - 170px);object-fit:contain;border-radius:6px}
.lightbox .cap{color:#F3F5F2;text-align:center;padding-top:12px;max-width:760px;margin:0 auto;font-size:14px}
.lightbox .cap b{font-size:16px;display:block}
.lightbox .nav-l,.lightbox .nav-r,.lightbox .close{position:absolute;background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:50%;width:44px;height:44px;display:grid;place-items:center;cursor:pointer}
.lightbox .nav-l{left:0;top:50%} .lightbox .nav-r{right:0;top:50%} .lightbox .close{right:0;top:0}
.lightbox svg{width:22px;height:22px}

/* ---------- Modal / toast / confirm ---------- */
.overlay{position:fixed;inset:0;background:rgba(32,32,32,.38);z-index:60;display:grid;place-items:center;padding:16px}
.modal{background:var(--white);border-radius:14px;width:100%;max-width:720px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.18)}
.modal.sm{max-width:440px}
.modal-h{padding:18px 22px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}
.modal-h h3{font-size:17px;flex:1}
.modal-b{padding:18px 22px;overflow-y:auto;min-height:0;flex:1 1 auto}
.modal-f{padding:14px 22px;border-top:1px solid var(--line2);display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.modal-f .err{color:var(--bad);font-size:13px;flex:1;min-width:160px}
.modal-f .meta{font-size:12px;color:var(--faint);flex:1}
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:120;display:grid;gap:8px}
.toast{background:var(--ink);color:#fff;border-radius:10px;padding:11px 14px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;gap:10px;align-items:center;max-width:360px}
.toast.bad{background:var(--bad)}
.toast button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:6px;padding:4px 9px;cursor:pointer;font-weight:600}

/* ---------- Activity ---------- */
.log{display:grid;gap:0}
.log-item{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line2);align-items:start}
.log-item .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700}
.log-item .av.fina{background:var(--pink);color:var(--pink-ink)} .log-item .av.unzi{background:var(--ink);color:#fff}
.log-item .av.sys{background:var(--mint);color:var(--forest)}
.log-item .d{font-size:12px;color:var(--muted)}
.log-item .chg{font-size:12.5px;color:var(--muted);margin-top:4px;display:grid;gap:2px}
.log-item .chg s{color:var(--faint)}

/* ---------- Responsive ---------- */
@media (max-width:1180px){
  .charts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .chart-card.wide{grid-column:span 2}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;z-index:80;width:272px;transform:translateX(-102%);transition:transform .2s;height:100%;padding-top:calc(20px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.25)}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:70}
  .topbar{padding:8px 16px}
  .topbar .menu-btn{display:inline-grid}
  .content{padding:16px 16px 60px}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .hero{grid-template-columns:minmax(0,1fr);padding:22px 18px}
  .count-box{text-align:left;padding:0}
  .tl-phase{grid-template-columns:minmax(0,1fr);gap:8px}
  .tl-phase:before{display:none}
  .tl-when{text-align:left;padding-right:0;padding-left:16px}
  .tl-when:after{right:auto;left:0}
  .filterbar{position:static}
}
@media (max-width:640px){
  .charts{grid-template-columns:minmax(0,1fr)}
  .chart-card.wide{grid-column:auto}
  .kpi .v{font-size:19px}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .who .nm,.save-state .txt-long{display:none}
  .modal{max-height:calc(100vh - 16px)}
  .overlay{padding:8px;align-items:end}
  .search{max-width:none;min-width:0;flex-basis:100%}
  /* tables become stacked cards */
  .table-wrap.cards{border:0;background:none;overflow:visible}
  .table-wrap.cards table.t,.table-wrap.cards tbody,.table-wrap.cards tr,.table-wrap.cards td{display:block;width:100%}
  .table-wrap.cards thead{display:none}
  .table-wrap.cards tr{background:var(--white);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;padding:6px 0}
  .table-wrap.cards td{border:0;padding:5px 14px;display:flex;justify-content:space-between;gap:12px;text-align:right}
  .table-wrap.cards td:before{content:attr(data-label);color:var(--muted);font-size:12px;font-weight:600;text-align:left;flex:none}
  .table-wrap.cards td:first-child{text-align:left;display:block;padding-top:8px}
  .table-wrap.cards td:first-child:before{display:none}
  .table-wrap.cards tfoot{display:block}
  .table-wrap.cards tfoot tr{background:var(--mint)}
  .table-wrap.cards td.money{text-align:right}
  .prog-row{grid-template-columns:100px minmax(0,1fr) 54px}
  .masonry{columns:2 140px;column-gap:10px}
  .pin .acts{opacity:1}
}

/* =====================================================================
   STORAGE ADAPTERS
   CloudStore → claude.ai Artifact shared database (db) + asset storage.
   LocalStore → IndexedDB in this browser (downloaded / offline copy).
   ===================================================================== */
const COLLECTIONS = ['meta', 'tasks', 'todos', 'budget', 'payments', 'vendors', 'guests', 'rundown', 'seserahan', 'medical', 'documents', 'boards', 'images', 'activity'];

class CloudStore {
  constructor() { this.mode = 'cloud'; this.q = {}; }
  async init() {
    let c = null;
    for (let i = 0; i < 60 && !c; i++) { if (window.claude && typeof window.claude.use === 'function') c = window.claude; else await sleep(50); }
    if (!c) return 'absent';
    let db = null;
    try { db = await Promise.race([c.use('db'), sleep(10000).then(() => null)]); } catch (e) { db = null; }
    if (!db) return 'unavailable';
    this.db = db;
    try { this.assets = await Promise.race([c.use('assets'), sleep(8000).then(() => null)]); } catch (e) { this.assets = null; }
    try { this.dl = await Promise.race([c.use('downloads'), sleep(8000).then(() => null)]); } catch (e) { this.dl = null; }
    return 'ok';
  }
  subscribe(col, cb, onErr) {
    let unsub = () => {};
    const start = () => {
      unsub = this.db.collection(col).onSnapshot(
        snap => cb(snap.docs.map(d => Object.assign({}, d.data(), { id: d.id })), snap.metadata),
        e => { onErr && onErr(e); if (e && e.code === 'unavailable') setTimeout(start, 3000); });
    };
    start();
    return () => unsub();
  }
  _enqueue(key, fn) {
    const p = (this.q[key] || Promise.resolve()).catch(() => {}).then(fn);
    this.q[key] = p;
    return p;
  }
  put(col, id, data) { return this._enqueue(col + '/' + id, () => this.db.collection(col).doc(id).set(data)); }
  remove(col, id) { return this._enqueue(col + '/' + id, () => this.db.collection(col).doc(id).delete()); }
  canUpload() { return !!this.assets; }
  async uploadImage(blob, type) { const r = await this.assets.upload(blob, type ? { type } : undefined); return { ref: 'asset:' + r.id, url: r.url }; }
  imageSrc(ref) { return ref && ref.startsWith('asset:') ? '/_blob/' + ref.slice(6) : ''; }
  async deleteImage(ref) { if (this.assets && ref && ref.startsWith('asset:')) await this.assets.delete(ref.slice(6)); }
  async usage() { if (!this.assets) return null; try { return (await this.assets.list()).usage; } catch (e) { return null; } }
  async saveFile(filename, data) {
    if (!this.dl) throw { code: 'unavailable', message: 'Downloads are not available in this view.' };
    return this.dl.save({ filename, data });
  }
}

class LocalStore {
  constructor() { this.mode = 'local'; this.cache = {}; this.subs = {}; this.urls = {}; COLLECTIONS.forEach(c => { this.cache[c] = new Map(); this.subs[c] = []; }); }
  async init() {
    try {
      this.idb = await new Promise((res, rej) => {
        const r = indexedDB.open('fina-unzi-wedding-planner', 1);
        r.onupgradeneeded = () => { const d = r.result; d.createObjectStore('docs', { keyPath: 'k' }); d.createObjectStore('blobs', { keyPath: 'k' }); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
      await this._loadAll();
      try { this.bc = new BroadcastChannel('fu-wp'); this.bc.onmessage = async () => { await this._loadAll(); COLLECTIONS.forEach(c => this._notify(c)); }; } catch (e) {}
      return 'ok';
    } catch (e) { this.idb = null; this.memoryOnly = true; return 'memory'; }
  }
  _tx(store, mode) { return this.idb.transaction(store, mode).objectStore(store); }
  _req(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
  async _loadAll() {
    const all = await this._req(this._tx('docs', 'readonly').getAll());
    COLLECTIONS.forEach(c => this.cache[c] = new Map());
    all.forEach(row => { if (this.cache[row.col]) this.cache[row.col].set(row.id, row.data); });
  }
  _notify(col) { const rows = [...this.cache[col].entries()].map(([id, d]) => Object.assign({}, d, { id })); this.subs[col].forEach(cb => cb(rows, { fromCache: false, hasPendingWrites: false })); }
  subscribe(col, cb) { this.subs[col].push(cb); setTimeout(() => this._notify(col), 0); return () => { this.subs[col] = this.subs[col].filter(f => f !== cb); }; }
  async put(col, id, data) {
    if (this.idb) await this._req(this._tx('docs', 'readwrite').put({ k: col + '/' + id, col, id, data }));
    this.cache[col].set(id, clone(data)); this._notify(col); this.bc && this.bc.postMessage(col);
  }
  async remove(col, id) {
    if (this.idb) await this._req(this._tx('docs', 'readwrite').delete(col + '/' + id));
    this.cache[col].delete(id); this._notify(col); this.bc && this.bc.postMessage(col);
  }
  canUpload() { return !!this.idb; }
  async uploadImage(blob) { const k = genId(); await this._req(this._tx('blobs', 'readwrite').put({ k, blob })); this.urls[k] = URL.createObjectURL(blob); return { ref: 'idb:' + k, url: this.urls[k] }; }
  imageSrc(ref) {
    if (!ref || !ref.startsWith('idb:')) return '';
    const k = ref.slice(4);
    if (this.urls[k]) return this.urls[k];
    if (!this.idb) return '';
    this._req(this._tx('blobs', 'readonly').get(k)).then(row => {
      if (!row) return; this.urls[k] = URL.createObjectURL(row.blob);
      $$(`img[data-ref="${ref}"]`).forEach(im => im.src = this.urls[k]);
      $$(`[data-bgref="${ref}"]`).forEach(el => el.style.backgroundImage = `url("${this.urls[k]}")`);
    });
    return '';
  }
  async deleteImage(ref) { if (this.idb && ref && ref.startsWith('idb:')) await this._req(this._tx('blobs', 'readwrite').delete(ref.slice(4))); }
  async usage() { return null; }
  async saveFile(filename, data) {
    const blob = data instanceof Blob ? data : new Blob([data]);
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    return { status: 'saved' };
  }
}

const S = {
  data: Object.fromEntries(COLLECTIONS.map(c => [c, []])),
  loaded: new Set(),
  pendingWrites: {},
  settings() { return (this.data.meta.find(r => r.id === 'settings')) || {}; },
};
const live = col => S.data[col].filter(r => !r.deleted);
const byId = (col, id) => S.data[col].find(r => r.id === id);
const LABEL_FIELD = { tasks: 'title', todos: 'title', budget: 'name', payments: 'code', vendors: 'name', guests: 'name', rundown: 'activity', seserahan: 'name', medical: 'item', documents: 'item', boards: 'name', images: 'title', meta: 'id' };
const COL_NAMES = { tasks: 'Task', todos: 'To-do', budget: 'Budget item', payments: 'Payment', vendors: 'Vendor', guests: 'Guest', rundown: 'Rundown item', seserahan: 'Seserahan item', medical: 'Medical item', documents: 'Document', boards: 'Moodboard', images: 'Picture', meta: 'Wedding details' };
const COL_PAGE = { tasks: 'checklist', todos: 'todo', budget: 'budget', payments: 'budget', vendors: 'vendors', guests: 'guests', rundown: 'rundown', seserahan: 'seserahan', medical: 'medical', documents: 'documents', boards: 'moodboard', images: 'moodboard', meta: 'overview' };
function recLabel(col, r) {
  if (!r) return '';
  if (col === 'payments') { const b = byId('budget', r.budgetId); return `${fmtMoney(r.amount)} · ${r.type || 'Payment'}${b ? ' · ' + b.name : ''}`; }
  if (col === 'meta') return 'Wedding details';
  if (col === 'medical' || col === 'documents') return `${r.item || ''}${r.person ? ' (' + r.person + ')' : ''}`;
  return r[LABEL_FIELD[col]] || '(untitled)';
}
let STORE = null;
let ME = null; // 'Fina' | 'Unzi'

/* ---------- sync status ---------- */
const SYNC = { pending: 0, errors: [], lastSaved: null, loadError: null };
function paintSync() {
  const el = $('#saveState'); if (!el) return;
  el.className = 'save-state';
  let txt, title = '';
  if (!S.loaded.has('meta') && !SYNC.loadError) { el.classList.add('loading'); txt = 'Loading…'; }
  else if (SYNC.errors.length) { el.classList.add('error'); txt = `Save failed (${SYNC.errors.length}) · Retry`; title = 'Click to retry the failed changes'; }
  else if (SYNC.pending > 0) { el.classList.add('saving'); txt = navigator.onLine === false ? `Offline · ${plural(SYNC.pending, 'change')} waiting to sync` : `Saving ${SYNC.pending > 1 ? SYNC.pending + ' changes' : ''}…`; }
  else if (SYNC.loadError) { el.classList.add('error'); txt = 'Connection problem'; title = SYNC.loadError; }
  else { txt = SYNC.lastSaved ? `Saved · ${fmtTime(SYNC.lastSaved)}` : 'All changes saved'; }
  el.innerHTML = `<span class="dot"></span><span>${esc(txt)}</span>`;
  el.title = title;
}
async function tracked(fn, desc) {
  SYNC.pending++; paintSync();
  try {
    let r;
    try { r = await fn(); }
    catch (e) {
      const code = e && e.code;
      if (code === 'unavailable' || code === 'store_unavailable') { await sleep(600 + Math.random() * 800); r = await fn(); }
      else throw e;
    }
    SYNC.lastSaved = new Date();
    return r;
  } catch (e) {
    SYNC.errors.push({ fn, desc, e });
    toast(`Couldn't save ${desc || 'the change'}: ${errMsg(e)}`, 'bad', { label: 'Retry', act: retryFailed });
    throw e;
  } finally { SYNC.pending--; paintSync(); }
}
function errMsg(e) {
  if (!e) return 'unknown error';
  const map = { invalid_argument: 'you may not have edit access to this planner (ask the owner to share it with you as an Editor)', quota_exceeded: 'storage is full — empty the Trash or remove old items', resource_exhausted: 'too many changes at once — wait a moment and retry', revoked: 'access to this planner changed — reload the page', unavailable: 'the connection dropped — check your internet and retry', not_granted: 'this view is read-only', too_large: 'the file is too large (max 20 MB)', unsupported_type: 'that file type is not supported (use JPG, PNG, WEBP or GIF)', quota_or_state: 'image storage is full', rate_limited: 'too many uploads at once — wait a moment', declined: 'the download was cancelled' };
  return map[e.code] || e.message || String(e);
}
async function retryFailed() {
  const list = SYNC.errors.splice(0); paintSync();
  for (const it of list) { try { await tracked(it.fn, it.desc); } catch (e) {} }
  if (!SYNC.errors.length) toast('All changes saved');
}
window.addEventListener('beforeunload', e => { if (SYNC.pending > 0 || SYNC.errors.length || document.querySelector('.modal.dirty')) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('online', paintSync); window.addEventListener('offline', paintSync);

/* ---------- mutations ---------- */
function stamp(rec, isNew) {
  const now = new Date().toISOString();
  rec.updatedAt = now; rec.updatedBy = ME || 'System';
  if (isNew) { rec.createdAt = now; rec.createdBy = ME || 'System'; rec.deleted = false; }
  return rec;
}
function diff(prev, next) {
  const skip = new Set(['updatedAt', 'updatedBy', 'createdAt', 'createdBy', 'id']);
  const keys = new Set([...Object.keys(prev || {}), ...Object.keys(next || {})]);
  const out = [];
  keys.forEach(k => {
    if (skip.has(k)) return;
    const a = prev ? prev[k] : undefined, b = next ? next[k] : undefined;
    const na = a === undefined || a === null ? '' : a, nb = b === undefined || b === null ? '' : b;
    if (JSON.stringify(na) !== JSON.stringify(nb)) out.push({ f: k, from: na, to: nb });
  });
  return out;
}
async function saveRecord(col, rec, opts = {}) {
  const isNew = !rec.id || !byId(col, rec.id);
  const id = rec.id || genId();
  const prev = isNew ? null : clone(byId(col, id));
  const doc = stamp(Object.assign({}, prev || {}, rec, { id }), isNew);
  if (col === 'tasks' && doc.status === 'Completed' && !doc.completedAt) doc.completedAt = todayISO();
  const body = JSON.parse(JSON.stringify(doc));
  delete body.id;
  const changes = diff(prev, doc);
  if (!isNew && !changes.length && !opts.force) return doc;
  await tracked(() => STORE.put(col, id, body), (COL_NAMES[col] || 'record').toLowerCase());
  if (!opts.silent) logActivity(isNew ? 'added' : 'updated', col, doc, prev, changes, opts.note);
  return doc;
}
async function softDelete(col, id, opts = {}) {
  const prev = byId(col, id); if (!prev) return;
  const doc = stamp(Object.assign(clone(prev), { deleted: true, deletedAt: new Date().toISOString(), deletedBy: ME }), false);
  const body = clone(doc); delete body.id;
  await tracked(() => STORE.put(col, id, body), 'deletion');
  if (!opts.silent) logActivity('deleted', col, doc, prev, [], opts.note);
}
async function restoreRecord(col, id) {
  const prev = byId(col, id); if (!prev) return;
  const doc = stamp(Object.assign(clone(prev), { deleted: false, deletedAt: null, deletedBy: null }), false);
  const body = clone(doc); delete body.id;
  await tracked(() => STORE.put(col, id, body), 'restore');
  logActivity('restored', col, doc, prev, []);
}
async function purgeRecord(col, id) {
  const r = byId(col, id);
  if (col === 'images' && r && r.ref) { try { await STORE.deleteImage(r.ref); } catch (e) {} }
  await tracked(() => STORE.remove(col, id), 'permanent deletion');
}

/* ---------- activity log ---------- */
let pruning = false;
function logActivity(action, col, after, before, changes, note) {
  if (col === 'activity') return;
  const id = genId();
  const entry = {
    ts: new Date().toISOString(), user: ME || 'System', action, col, recId: after ? after.id : (before && before.id),
    label: recLabel(col, after || before), changes: (changes || []).slice(0, 12).map(c => ({ f: c.f, from: shortVal(c.from), to: shortVal(c.to) })),
    before: before ? JSON.parse(JSON.stringify(before)) : null, afterAt: after ? after.updatedAt : null, note: note || '', deleted: false,
  };
  if (entry.before) { delete entry.before.id; }
  tracked(() => STORE.put('activity', id, entry), 'activity log').catch(() => {});
  const count = S.data.activity.length;
  if (count > 420 && !pruning) {
    pruning = true;
    const old = [...S.data.activity].sort((a, b) => (a.ts || '').localeCompare(b.ts || '')).slice(0, count - 380);
    (async () => { for (const r of old) { try { await STORE.remove('activity', r.id); } catch (e) {} } pruning = false; })();
  }
}
function shortVal(v) { if (v === null || v === undefined) return ''; if (typeof v === 'object') return JSON.stringify(v).slice(0, 80); const s = String(v); return s.length > 80 ? s.slice(0, 77) + '…' : s; }

async function revertActivity(a) {
  const cur = byId(a.col, a.recId);
  if (a.action === 'added') { if (cur && !cur.deleted) await softDelete(a.col, a.recId, { note: 'Undo of "added"' }); }
  else if (a.action === 'deleted') { if (cur) await restoreRecord(a.col, a.recId); }
  else if (a.action === 'restored') { if (cur) await softDelete(a.col, a.recId, { note: 'Undo of "restored"' }); }
  else if (a.action === 'updated' && a.before) {
    const prevDoc = Object.assign({}, a.before, { id: a.recId });
    const now = stamp(clone(prevDoc), false);
    const body = clone(now); delete body.id;
    await tracked(() => STORE.put(a.col, a.recId, body), 'undo');
    logActivity('reverted', a.col, now, cur, diff(cur, now), 'Restored the version before this change');
  }
}

function toast(msg, kind = '', action) {

let modalStack = [];

    <div class="modal-b">${body}</div>${footer !== null ? `<div class="modal-f">${footer || ''}</div>` : ''}</div>`;
  document.body.appendChild(ov);

}

function confirmBox({ title, text, ok = 'Confirm', danger = false }) {

    }

    case 'number': inp = `<input class="input num" id="${id}" name="${f.k}" type="number" inputmode="decimal" step="any" min="${f.min ?? ''}" value="${esc(v)}" placeholder="${esc(f.ph || '')}">`; break;

/* Generic record editor: opens a modal, validates, saves, closes only after persisted. */
function editRecord(col, id, preset = {}, opts = {}) {
  const schema = SCHEMAS[col]; if (!schema) return;
  const rec = id ? byId(col, id) : null;
  if (id && !rec) { toast('That record no longer exists.', 'bad'); return; }
  const fields = typeof schema.fields === 'function' ? schema.fields(rec) : schema.fields;
  const val = Object.assign({}, schema.defaults ? schema.defaults() : {}, rec || {}, preset);
  const title = (rec ? 'Edit ' : 'Add ') + (COL_NAMES[col] || 'record').toLowerCase();
  const meta = rec ? `Last edited by ${esc(rec.updatedBy || '—')} · ${esc(fmtTs(rec.updatedAt))}` : '';
  const m = openModal({
    title: opts.title || title,
    body: `${schema.intro ? `<div class="warnbox info" style="margin-bottom:14px">${ic('info')}<div>${schema.intro}</div></div>` : ''}<form class="form-grid" novalidate>${fields.map(f => fieldHTML(f, val[f.k])).join('')}</form>${schema.extra ? `<div style="margin-top:14px">${schema.extra(rec || val)}</div>` : ''}`,
    footer: `${rec ? `<button class="btn danger" data-del>${ic('trash')} Delete</button>` : ''}<span class="meta">${meta}</span><span class="err" hidden></span><button class="btn" data-cancel>Cancel</button><button class="btn primary" data-save>${ic('check')} Save</button>`,
  });

  form.addEventListener('input', () => { m.el.classList.add('dirty'); schema.onInput && schema.onInput(form, rec); });
  form.addEventListener('change', () => { m.el.classList.add('dirty'); schema.onInput && schema.onInput(form, rec); });
  schema.onInput && schema.onInput(form, rec);
  schema.onMount && schema.onMount(m, rec);
  m.el.querySelector('[data-cancel]').onclick = () => m.close();
  const errEl = m.el.querySelector('.err');
  const save = async () => {
    const data = readForm(form, fields);
    const missing = fields.filter(f => f.req && (data[f.k] === '' || data[f.k] === undefined));
    $$('.invalid', form).forEach(e => e.classList.remove('invalid'));
    if (missing.length) { missing.forEach(f => { const e = form.querySelector(`[name="${f.k}"]`); e && e.classList.add('invalid'); }); errEl.hidden = false; errEl.textContent = 'Please fill in: ' + missing.map(f => f.label).join(', '); return; }

    const btn = m.el.querySelector('[data-save]'); btn.disabled = true; btn.textContent = 'Saving…'; errEl.hidden = true;
    try {
      const toSave = Object.assign({}, data, { id: rec ? rec.id : undefined });
      if (schema.beforeSave) await schema.beforeSave(toSave, rec);
      const saved = await saveRecord(col, toSave);
      if (schema.afterSave) await schema.afterSave(saved, rec);
      m.el.classList.remove('dirty'); m.close(true);
      toast(`${COL_NAMES[col]} saved`);
      opts.onSaved && opts.onSaved(saved);
    } catch (e) {
      btn.disabled = false; btn.innerHTML = ic('check') + ' Save';
      errEl.hidden = false; errEl.textContent = 'Not saved: ' + errMsg(e) + '. Your edits are still here — try again.';
    }

}

/* ---------- derived: settings / dates ---------- */
const settings = () => S.settings();
function weddingDate() { return settings().weddingDate || settings().akadDate || settings().receptionDate || ''; }

  const wd = weddingDate(); const p = PHASES.find(x => x[0] === ph); if (!wd || !p) return '';
  const d = parseISO(wd);
  if (p[2].m) { const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() - p[2].m); const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, last)); }

function daysToWedding() { const wd = weddingDate(); return wd ? daysBetween(todayISO(), wd) : null; }

/* ---------- derived: tasks ---------- */
const taskDue = t => t.deadline || phaseDate(t.phase) || '';
function taskState(t) {
  if (t.status === 'Completed') return 'Completed';
  if (t.status === 'Cancelled') return 'Cancelled';
  const d = taskDue(t);
  if (d && d < todayISO()) return 'Overdue';
  if (t.status === 'In Progress') return 'In Progress';

}
function taskRowCls(t) { const st = taskState(t); if (st === 'Completed' || st === 'Cancelled') return 'done'; if (st === 'Overdue') return 'overdue'; const d = taskDue(t); if (d && daysBetween(todayISO(), d) <= 7) return 'soon'; return ''; }
function progressOf(tasks) { const act = tasks.filter(t => t.status !== 'Cancelled'); const done = act.filter(t => t.status === 'Completed').length; return { done, total: act.length, pct: pct(done, act.length) }; }

/* ---------- derived: budget ---------- */
function paymentsFor(itemId) { return live('payments').filter(p => p.budgetId === itemId); }
const paySigned = p => (p.type === 'Refund' ? -1 : 1) * num(p.amount);
function budgetDerived(item) {
  const pays = paymentsFor(item.id);
  const paid = pays.reduce((s, p) => s + paySigned(p), 0);
  const deposit = pays.filter(p => p.type === 'Deposit').reduce((s, p) => s + num(p.amount), 0);
  const lastPay = pays.map(p => p.date || '').sort().pop() || '';
  const actual = num(item.actualCost);
  const outstanding = Math.max(0, actual - paid);
  const credit = Math.max(0, paid - actual);
  const allocated = num(item.allocated);
  const variance = allocated - actual;
  let status;
  if (actual <= 0 && paid <= 0) status = 'Not priced';
  else if (actual > 0 && paid >= actual) status = 'Paid';
  else if (item.paymentDeadline && item.paymentDeadline < todayISO() && outstanding > 0) status = 'Overdue';
  else if (paid > 0) status = 'Partially Paid';

function catAlloc(cat) { const a = (settings().catAlloc || {})[cat]; return num(a); }
function categoryTable() {
  const rows = budgetRows();
  return BUDGET_CATS.map(cat => {
    const items = rows.filter(r => r.category === cat);
    const itemsAlloc = items.reduce((s, r) => s + r._d.allocated, 0);
    const setAlloc = catAlloc(cat);
    return {
      cat, items: items.length, setAlloc, itemsAlloc,
      budget: setAlloc > 0 ? setAlloc : itemsAlloc,
      minEst: items.reduce((s, r) => s + num(r.minEst), 0), maxEst: items.reduce((s, r) => s + num(r.maxEst), 0),
      actual: items.reduce((s, r) => s + r._d.actual, 0), paid: items.reduce((s, r) => s + r._d.paid, 0),
      outstanding: items.reduce((s, r) => s + r._d.outstanding, 0),

    const other = rows.filter(r => !BUDGET_CATS.includes(r.category));
    if (!other.length) return [];
    return [{ cat: 'Uncategorised', items: other.length, setAlloc: 0, itemsAlloc: other.reduce((s, r) => s + r._d.allocated, 0), budget: other.reduce((s, r) => s + r._d.allocated, 0), minEst: 0, maxEst: 0, actual: other.reduce((s, r) => s + r._d.actual, 0), paid: other.reduce((s, r) => s + r._d.paid, 0), outstanding: other.reduce((s, r) => s + r._d.outstanding, 0) }];
  })()).map(c => Object.assign(c, { variance: c.budget - c.actual }));

/* ---------- derived: vendors ---------- */
function vendorPrice(v) { return num(v.negotiatedPrice) || num(v.quotedPrice); }
function vendorPaid(v) { const b = v.budgetId && byId('budget', v.budgetId); return b && !b.deleted ? budgetDerived(b).paid : 0; }
function vendorRemaining(v) { const price = vendorPrice(v); if (!price) return 0; const b = v.budgetId && byId('budget', v.budgetId); if (b && !b.deleted) return Math.max(0, price - budgetDerived(b).paid); return Math.max(0, price - num(v.deposit)); }

/* ---------- derived: guests ---------- */
const guestTotal = g => Math.max(0, num(g.adults)) + Math.max(0, num(g.children));
const guestExpected = g => g.rsvp === 'Declined' ? 0 : g.rsvp === 'Attending' ? (g.confirmed !== '' && g.confirmed != null ? num(g.confirmed) : guestTotal(g)) : guestTotal(g);
const guestConfirmed = g => g.rsvp === 'Attending' ? (g.confirmed !== '' && g.confirmed != null ? num(g.confirmed) : guestTotal(g)) : 0;
function guestStats() {
  const gs = live('guests');
  return {
    packs: gs.length, people: gs.reduce((s, g) => s + guestTotal(g), 0),
    expected: gs.reduce((s, g) => s + guestExpected(g), 0),
    confirmed: gs.reduce((s, g) => s + guestConfirmed(g), 0),
    attendingPacks: gs.filter(g => g.rsvp === 'Attending').length,
    sent: gs.filter(g => g.invStatus === 'Sent').length,
  };
}

/* ---------- derived: rundown ---------- */
function rundownRows() {
  const wd = weddingDate();
  const rows = live('rundown').map(r => {
    const s = timeToMin(r.start); let e = timeToMin(r.end); const dur = num(r.duration);
    if (s != null && dur > 0) e = s + dur;
    return Object.assign({}, r, { _s: s, _e: e, _dur: s != null && e != null ? e - s : dur || null, _date: r.date || wd || '' });
  }).sort((a, b) => (a._date || '').localeCompare(b._date || '') || (a._s ?? 9999) - (b._s ?? 9999));
  rows.forEach(r => { r._overlaps = []; r._conflicts = []; });
  for (let i = 0; i < rows.length; i++) for (let j = i + 1; j < rows.length; j++) {
    const a = rows[i], b = rows[j];
    if (a._date !== b._date || a._s == null || b._s == null || a._e == null || b._e == null) continue;
    if (a._s < b._e && b._s < a._e) {
      const same = (a.location && b.location && a.location.trim().toLowerCase() === b.location.trim().toLowerCase()) ||
        (a.pic && b.pic && a.pic.trim().toLowerCase() === b.pic.trim().toLowerCase() && !['both', 'family'].includes(a.pic.trim().toLowerCase())) ||
        (a.vendorId && a.vendorId === b.vendorId);
      (same ? a._conflicts : a._overlaps).push(b.activity); (same ? b._conflicts : b._overlaps).push(a.activity);
    }
  }
  return rows;
}

/* ---------- cross-record links ---------- */
async function linkBookedVendor(v) {
  let bid = v.budgetId && byId('budget', v.budgetId) && !byId('budget', v.budgetId).deleted ? v.budgetId : null;
  const cat = VENDOR_TO_BUDGET[v.category] || 'Others';
  if (!bid) {
    const cand = live('budget').find(b => b.category === cat && !b.vendorId);
    const price = vendorPrice(v);
    if (cand) {
      await saveRecord('budget', { id: cand.id, vendorId: v.id, actualCost: num(cand.actualCost) || price || cand.actualCost || '' }, { note: `Linked to booked vendor ${v.name}` });
      bid = cand.id;
    } else {
      const nb = await saveRecord('budget', { code: nextCode('budget', 'B'), category: cat, name: `${v.category}: ${v.name}`, qty: 1, actualCost: price || '', allocated: '', vendorId: v.id, pic: 'Both', notes: 'Created automatically when the vendor was booked.' });
      bid = nb.id;
    }
    await saveRecord('vendors', { id: v.id, budgetId: bid }, { silent: true });
    toast(`Linked ${v.name} to the budget (${cat})`);
  } else {
    const b = byId('budget', bid);
    if (b.vendorId !== v.id) await saveRecord('budget', { id: bid, vendorId: v.id }, { silent: true });
  }
}
async function syncSeserahanBudget(bid) {
  if (!bid) return; const b = byId('budget', bid); if (!b || b.deleted) return;
  const linked = live('seserahan').filter(s => s.budgetId === bid);
  const alloc = linked.reduce((s, x) => s + num(x.budget), 0), act = linked.reduce((s, x) => s + num(x.actualCost), 0);
  if (num(b.allocated) !== alloc || num(b.actualCost) !== act) await saveRecord('budget', { id: bid, allocated: alloc, actualCost: act }, { note: 'Synced from Seserahan & Mahar tracker' });
}

async function loadStarterTemplate(onProgress) {
  const t = starterTemplate();
  const jobs = [];
  if (!byId('meta', 'settings')) jobs.push(['meta', 'settings', t.meta.settings]);
  ['tasks', 'budget', 'rundown', 'seserahan', 'medical', 'documents', 'boards'].forEach(col => {
    if (live(col).length) return; // never duplicate a section that already has records
    t[col].forEach(r => jobs.push([col, genId(), r]));
  });
  let i = 0;
  for (const [col, id, r] of jobs) {
    const now = new Date().toISOString();
    const body = Object.assign({}, r, { createdAt: now, createdBy: ME || 'System', updatedAt: now, updatedBy: ME || 'System', deleted: false });
    await tracked(() => STORE.put(col, id, body), 'starter template');
    onProgress && onProgress(++i, jobs.length);
  }
  logActivity('added', 'meta', { id: 'settings', updatedAt: new Date().toISOString() }, null, [], `Loaded the starter template (${jobs.length} records)`);
  return jobs.length;
}

      <div class="row small muted" style="justify-content:space-between"><span>Spent ${fmtMoney(bt.actual)}</span><span>${F.budgetCat ? 'Budget ' + fmtMoney(bt.catBudget || 0) : bt.target ? 'Target ' + fmtMoney(bt.target) : 'No target set'}</span></div></div>
    ${chartCard('ch_pay', 'Payment status', 'Budget items with an agreed cost · click to filter', { empty: '<span id="em_pay" hidden>Enter actual costs on budget items to track payments.</span>' })}
    ${chartCard('ch_month', 'Monthly wedding spending', 'Payments recorded per month · click a month', { empty: '<span id="em_month" hidden>No payments recorded yet.</span>' })}
    ${chartCard('ch_prog', 'Preparation progress', 'Tasks by status · click to list them', { empty: '<span id="em_prog" hidden>No tasks yet.</span>' })}
    ${chartCard('ch_guest', 'Guest distribution', 'Invitation packs by relationship owner', { empty: '<span id="em_guest" hidden>No guests added yet.</span>' })}
    ${chartCard('ch_rsvp', 'RSVP overview', F.guestOwner ? `${esc(F.guestOwner)}'s guests · packs` : 'Invitation packs by RSVP', { empty: '<span id="em_rsvp" hidden>No guests added yet.</span>' })}
    ${chartCard('ch_vendor', 'Vendor booking status', F.vendorCat ? `${esc(F.vendorCat)} candidates` : 'All vendor candidates', { head: vcatSel, full: true, h: 210, empty: '<span id="em_vendor" hidden>No vendors added yet.</span>' })}
  </section>`;

  const firstRun = !live('tasks').length && !live('budget').length && !live('boards').length ? `<div class="card" style="border-color:var(--sage)"><div class="row"><div style="flex:1;min-width:220px"><h3>Start with the planning template</h3><div class="hint">Adds a 12-month task timeline, budget line items (no amounts), a rundown draft, seserahan, medical and KUA document checklists and 21 moodboards. No guests, vendors or prices are invented.</div></div><button class="btn primary" data-act="load-template">${ic('sparkle')} Load starter template</button></div></div>` : '';

  return firstRun + hero + kpis + upcoming + filterbar + focus + charts;
}

function priorityItems() {
  const out = []; const today = todayISO();
  live('tasks').forEach(t => {
    const st = taskState(t); const d = taskDue(t);
    if (st === 'Overdue') out.push({ kind: 'bad', icon: 'alert', title: t.title, sub: `Task overdue · due ${fmtDate(d)} · ${t.pic || 'Both'}`, act: 'edit', col: 'tasks', id: t.id, sort: d });
    else if (st !== 'Completed' && st !== 'Cancelled' && d && daysBetween(today, d) <= 7) out.push({ kind: 'warn', icon: 'clock', title: t.title, sub: `Task due ${fmtDate(d)} · ${t.pic || 'Both'}`, act: 'edit', col: 'tasks', id: t.id, sort: d });
  });
  live('todos').forEach(t => { if (!t.done && t.due && daysBetween(today, t.due) <= 7) out.push({ kind: t.due < today ? 'bad' : 'warn', icon: 'todo', title: t.title, sub: `To-do ${t.due < today ? 'overdue' : 'due'} ${fmtDate(t.due)}`, act: 'edit', col: 'todos', id: t.id, sort: t.due }); });
  budgetRows().forEach(r => {
    if (r._d.outstanding > 0 && r.paymentDeadline && daysBetween(today, r.paymentDeadline) <= 30)
      out.push({ kind: r.paymentDeadline < today ? 'bad' : 'warn', icon: 'wallet', title: `Pay ${r.name}`, sub: `${fmtMoney(r._d.outstanding)} ${r.paymentDeadline < today ? 'overdue since' : 'due'} ${fmtDate(r.paymentDeadline)}`, act: 'edit', col: 'budget', id: r.id, sort: r.paymentDeadline });
  });
  live('vendors').forEach(v => {
    if (v.bookingDeadline && !['Booked', 'Not Chosen'].includes(v.status) && daysBetween(today, v.bookingDeadline) <= 30)
      out.push({ kind: v.bookingDeadline < today ? 'bad' : 'warn', icon: 'store', title: `Decide on ${v.name}`, sub: `${v.category} booking deadline ${fmtDate(v.bookingDeadline)}`, act: 'edit', col: 'vendors', id: v.id, sort: v.bookingDeadline });
  });
  const st = settings(); const miss = [];
  if (!weddingDate()) miss.push(['Wedding date not set', 'Needed for the countdown and timeline deadlines', 'overview']);
  if (!num(st.targetBudget)) miss.push(['Target budget not set', 'Needed for remaining budget and usage', 'overview']);
  if (!st.venue) miss.push(['Venue not decided', 'Record it in Wedding Overview when chosen', 'overview']);
  miss.forEach(m => out.push({ kind: 'info', icon: 'info', title: m[0], sub: m[1], act: 'go', page: m[2], sort: 'zz' }));
  const bookedCats = new Set(live('vendors').filter(v => v.status === 'Booked').map(v => v.category));
  CRITICAL_VENDORS.forEach(c => { if (!bookedCats.has(c)) out.push({ kind: 'info', icon: 'store', title: `No ${c.toLowerCase()} booked yet`, sub: 'Critical vendor decision', act: 'go-f', page: 'vendors', k: 'vendorCat', v: c, sort: 'zz' + c }); });
  const kindOrder = { bad: 0, warn: 1, info: 2 };
  return out.sort((a, b) => kindOrder[a.kind] - kindOrder[b.kind] || String(a.sort).localeCompare(String(b.sort)));
}

function filteredPanel() {
  const blocks = [];

    blocks.push(`<div><div class="row" style="margin-bottom:8px"><b>${esc(title)}</b><span class="tcount">${plural(rows.length, 'record')}</span><span class="spacer"></span><button class="btn sm ghost" data-act="go" data-page="${page}">Open page ${ic('right')}</button></div>
    ${rows.length ? table({ id: 'fp_' + col, col, rows: rows.slice(0, 8), cols }) + (rows.length > 8 ? `<div class="small muted" style="margin-top:6px">Showing 8 of ${rows.length}.</div>` : '') : '<div class="muted small">No matching records.</div>'}</div>`);
  };
  if (F.budgetCat || F.payStatus) {
    const rows = budgetRows().filter(r => (!F.budgetCat || r.category === F.budgetCat) && (!F.payStatus || r._d.status === F.payStatus));
    mini('Budget items', 'budget', rows, [{ k: 'name', label: 'Item', render: r => `<span class="title">${esc(r.name)}</span><div class="sub">${esc(r.category)}</div>` }, { k: 'actual', label: 'Actual', money: true, render: r => fmtMoney(r._d.actual) }, { k: 'paid', label: 'Paid', money: true, render: r => fmtMoney(r._d.paid) }, { k: 'st', label: 'Status', render: r => `<span class="pill ${payPillCls(r._d.status)}">${r._d.status}</span>` }], 'budget');
  }
  if (F.month || F.budgetCat) {
    const rows = live('payments').filter(p => { const b = byId('budget', p.budgetId); return (!F.month || monthKey(p.date) === F.month) && (!F.budgetCat || (b && b.category === F.budgetCat)); });
    if (F.month || rows.length) mini('Payments', 'payments', rows, [{ k: 'date', label: 'Date', render: r => fmtDate(r.date) }, { k: 'item', label: 'Budget item', render: r => esc((byId('budget', r.budgetId) || {}).name || '—') }, { k: 'type', label: 'Type' }, { k: 'amount', label: 'Amount', money: true, render: r => (r.type === 'Refund' ? '−' : '') + fmtMoney(r.amount) }], 'budget');
  }
  if (F.taskState) {

    mini(`${F.taskState} tasks`, 'tasks', rows, [{ k: 'title', label: 'Task', render: r => `<span class="title">${esc(r.title)}</span>` }, { k: 'due', label: 'Due', render: r => fmtDate(taskDue(r)) || '—' }, { k: 'pic', label: 'PIC', render: r => personPill(r.pic) }], 'checklist');
  }
  if (F.guestOwner || F.rsvp) {
    const rows = live('guests').filter(g => (!F.guestOwner || g.owner === F.guestOwner) && (!F.rsvp || (g.rsvp || 'Pending') === F.rsvp));
    mini('Guests', 'guests', rows, [{ k: 'name', label: 'Guest', render: r => `<span class="title">${esc(r.name)}</span>` }, { k: 'n', label: 'People', render: r => guestTotal(r) }, { k: 'owner', label: 'Owner', render: r => personPill(r.owner) }, { k: 'rsvp', label: 'RSVP', render: r => `<span class="pill ${statusPillCls(r.rsvp)}">${esc(r.rsvp || 'Pending')}</span>` }], 'guests');
  }
  if (F.vendorCat || F.vendorStatus) {
    const rows = live('vendors').filter(v => (!F.vendorCat || v.category === F.vendorCat) && (!F.vendorStatus || v.status === F.vendorStatus));
    mini('Vendors', 'vendors', rows, [{ k: 'name', label: 'Vendor', render: r => `<span class="title">${esc(r.name)}</span><div class="sub">${esc(r.category)}</div>` }, { k: 'price', label: 'Price', money: true, render: r => vendorPrice(r) ? fmtMoney(vendorPrice(r)) : '—' }, { k: 'status', label: 'Status', render: r => `<span class="pill ${statusPillCls(r.status)}">${esc(r.status)}</span>` }], 'vendors');
  }

function drawDashboardCharts() {
  if (!window.Chart) { $$('.chart-card .cv').forEach(cv => { if (!cv.querySelector('.cdn-miss')) cv.insertAdjacentHTML('beforeend', '<div class="chart-empty cdn-miss">Charts need an internet connection to load the chart library.</div>'); }); return; }
  chartDefaults();
  const show = (id, empty) => { const e = document.getElementById(id); if (e) e.hidden = !empty; };

  // 1. Budget allocation doughnut
  const cats = categoryTable().filter(c => c.budget > 0).sort((a, b) => b.budget - a.budget);
  const top = cats.slice(0, 6), rest = cats.slice(6);
  const labels = top.map(c => c.cat).concat(rest.length ? ['Other categories'] : []);
  const vals = top.map(c => c.budget).concat(rest.length ? [rest.reduce((s, c) => s + c.budget, 0)] : []);
  const cols = top.map((c, i) => fade(PAL.cat[i], !F.budgetCat || F.budgetCat === c.cat)).concat(rest.length ? [fade(PAL.other, !F.budgetCat || rest.some(r => r.cat === F.budgetCat))] : []);
  show('em_alloc', !vals.length);
  if (vals.length) mk('ch_alloc', { type: 'doughnut', data: { labels, datasets: [{ data: vals, backgroundColor: cols, borderColor: '#FFFFFF', borderWidth: 2, hoverOffset: 6 }] },
    options: doughnutOpts(i => { if (labels[i] === 'Other categories') { toast('Pick one of these categories on the Budget page: ' + rest.map(r => r.cat).join(', ')); return; } setF('budgetCat', labels[i]); },
      ctx => { const tot = vals.reduce((a, b) => a + b, 0); const extra = ctx.label === 'Other categories' ? ' (' + rest.map(r => r.cat).join(', ') + ')' : ''; return ` ${fmtMoney(ctx.raw)} · ${pct(ctx.raw, tot)}%${extra}`; }) });

  // 2. Estimated vs actual (horizontal grouped bars)
  const ea = categoryTable().filter(c => c.budget > 0 || c.actual > 0);
  show('em_estact', !ea.length);
  if (ea.length) mk('ch_estact', { type: 'bar', data: { labels: ea.map(c => c.cat), datasets: [
    { label: 'Estimated (budget)', data: ea.map(c => c.budget), backgroundColor: ea.map(c => fade(PAL.est, !F.budgetCat || F.budgetCat === c.cat)), borderRadius: 4, borderSkipped: 'start', barPercentage: .8, categoryPercentage: .7 },
    { label: 'Actual', data: ea.map(c => c.actual), backgroundColor: ea.map(c => fade(PAL.act, !F.budgetCat || F.budgetCat === c.cat)), borderRadius: 4, borderSkipped: 'start', barPercentage: .8, categoryPercentage: .7 }] },
    options: { indexAxis: 'y', onClick: clickIdx(i => setF('budgetCat', ea[i].cat)), scales: { x: { ticks: { callback: moneyTick }, grid: { color: '#EEF1EC' } }, y: { grid: { display: false } } },
      plugins: { legend: { position: 'top', align: 'end' }, tooltip: { callbacks: { label: ctx => ` ${ctx.dataset.label}: ${fmtMoney(ctx.raw)}`, afterBody: items => { const c = ea[items[0].dataIndex]; return `Variance: ${fmtMoney(c.budget - c.actual)}`; } } } } } });

  // 3. Budget usage gauge
  const bt = budgetTotals(F.budgetCat);
  const base = F.budgetCat ? (bt.catBudget || 0) : bt.target;
  const used = bt.actual, over = base > 0 && used > base;
  const gl = document.getElementById('gaugeLabel');
  if (gl) gl.innerHTML = base > 0 ? `<div><div style="font-size:26px;font-weight:700;color:${over ? 'var(--bad)' : 'var(--ink)'}">${Math.round(used / base * 100)}%</div><div class="small muted">${over ? 'over budget by ' + fmtMoney(used - base) : fmtMoney(base - used) + ' left'}</div></div>` : `<div class="small muted" style="padding:0 20px">${F.budgetCat ? 'Set a budget for this category' : 'Set a target budget in Wedding Overview'}</div>`;
  mk('ch_gauge', { type: 'doughnut', data: { labels: ['Spent', 'Remaining'], datasets: [{ data: base > 0 ? [Math.min(used, base), Math.max(0, base - used)] : [0, 1], backgroundColor: [over ? '#C8423B' : '#1F8250', '#E8F0E7'], borderColor: '#FFFFFF', borderWidth: 2 }] },
    options: { rotation: -90, circumference: 180, cutout: '72%', plugins: { legend: { display: false }, tooltip: { enabled: base > 0, callbacks: { label: ctx => ` ${ctx.label}: ${fmtMoney(ctx.dataIndex === 0 ? used : Math.max(0, base - used))}` } } } } });

  // 4. Payment status
  const pr = budgetRows().filter(r => !F.budgetCat || r.category === F.budgetCat).filter(r => r._d.status !== 'Not priced');
  const pc = PAY_STATUS.map(s => pr.filter(r => r._d.status === s));
  show('em_pay', !pr.length);
  if (pr.length) mk('ch_pay', { type: 'doughnut', data: { labels: PAY_STATUS, datasets: [{ data: pc.map(a => a.length), backgroundColor: PAY_STATUS.map(s => fade(PAL.pay[s], !F.payStatus || F.payStatus === s)), borderColor: '#FFFFFF', borderWidth: 2, hoverOffset: 6 }] },
    options: doughnutOpts(i => setF('payStatus', PAY_STATUS[i]), ctx => { const a = pc[ctx.dataIndex]; return ` ${plural(ctx.raw, 'item')} · outstanding ${fmtMoney(a.reduce((s, r) => s + r._d.outstanding, 0))}`; }) });

  // 5. Monthly spending
  const pays = live('payments').filter(p => p.date && byId('budget', p.budgetId) && !byId('budget', p.budgetId).deleted).filter(p => !F.budgetCat || byId('budget', p.budgetId).category === F.budgetCat);
  const months = [...new Set(pays.map(p => monthKey(p.date)))].sort();
  show('em_month', !months.length);
  if (months.length) {
    const mv = months.map(m => pays.filter(p => monthKey(p.date) === m).reduce((s, p) => s + paySigned(p), 0));
    mk('ch_month', { type: 'bar', data: { labels: months.map(fmtMonth), datasets: [{ label: 'Paid', data: mv, backgroundColor: months.map(m => fade(PAL.est, !F.month || F.month === m)), borderRadius: 4, borderSkipped: 'start', maxBarThickness: 36 }] },
      options: { onClick: clickIdx(i => setF('month', months[i])), scales: { y: { ticks: { callback: moneyTick }, grid: { color: '#EEF1EC' } }, x: { grid: { display: false } } }, plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` ${fmtMoney(ctx.raw)} · ${plural(pays.filter(p => monthKey(p.date) === months[ctx.dataIndex]).length, 'payment')}` } } } } });
  }

  // 6. Preparation progress
  const states = ['Completed', 'In Progress', 'Pending', 'Overdue'];
  const tasks = live('tasks').filter(t => t.status !== 'Cancelled');
  const sc = states.map(s => tasks.filter(t => taskState(t) === s).length);
  show('em_prog', !tasks.length);
  if (tasks.length) mk('ch_prog', { type: 'doughnut', data: { labels: states, datasets: [{ data: sc, backgroundColor: states.map(s => fade(PAL.state[s], !F.taskState || F.taskState === s)), borderColor: '#FFFFFF', borderWidth: 2, hoverOffset: 6 }] },
    options: doughnutOpts(i => setF('taskState', states[i]), ctx => ` ${plural(ctx.raw, 'task')} · ${pct(ctx.raw, tasks.length)}%`) });

  // 7. Guest distribution
  const guests = live('guests');
  show('em_guest', !guests.length); show('em_rsvp', !guests.length);
  if (guests.length) {
    const owners = PIC; const oc = owners.map(o => guests.filter(g => g.owner === o));
    mk('ch_guest', { type: 'doughnut', data: { labels: owners, datasets: [{ data: oc.map(a => a.length), backgroundColor: owners.map(o => fade(PAL.owner[o], !F.guestOwner || F.guestOwner === o)), borderColor: '#FFFFFF', borderWidth: 2, hoverOffset: 6 }] },
      options: doughnutOpts(i => setF('guestOwner', owners[i]), ctx => ` ${plural(ctx.raw, 'pack')} · ${fmtNum(oc[ctx.dataIndex].reduce((s, g) => s + guestTotal(g), 0))} people`) });
    const gf = guests.filter(g => !F.guestOwner || g.owner === F.guestOwner);
    const rc = RSVP.map(r => gf.filter(g => (g.rsvp || 'Pending') === r));
    mk('ch_rsvp', { type: 'bar', data: { labels: RSVP, datasets: [{ label: 'Packs', data: rc.map(a => a.length), backgroundColor: RSVP.map(r => fade(PAL.rsvp[r], !F.rsvp || F.rsvp === r)), borderRadius: 4, borderSkipped: 'start', maxBarThickness: 48 }] },
      options: { onClick: clickIdx(i => setF('rsvp', RSVP[i])), scales: { y: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: '#EEF1EC' } }, x: { grid: { display: false } } }, plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => { const a = rc[ctx.dataIndex]; return ` ${plural(ctx.raw, 'pack')} · ${fmtNum(RSVP[ctx.dataIndex] === 'Attending' ? a.reduce((s, g) => s + guestConfirmed(g), 0) : a.reduce((s, g) => s + guestTotal(g), 0))} people`; } } } } } });
  }

  // 8. Vendor status
  const vs = live('vendors').filter(v => !F.vendorCat || v.category === F.vendorCat);
  show('em_vendor', !vs.length);
  const vstat = VENDOR_STATUS.slice(0, 4).concat(vs.some(v => v.status === 'Not Chosen') ? ['Not Chosen'] : []);
  if (vs.length) mk('ch_vendor', { type: 'bar', data: { labels: vstat, datasets: [{ label: 'Vendors', data: vstat.map(s => vs.filter(v => (v.status || 'Not Contacted') === s).length), backgroundColor: vstat.map(s => fade(PAL.vendor[s], !F.vendorStatus || F.vendorStatus === s)), borderRadius: 4, borderSkipped: 'start', maxBarThickness: 40 }] },
    options: { indexAxis: 'y', onClick: clickIdx(i => setF('vendorStatus', vstat[i])), scales: { x: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: '#EEF1EC' } }, y: { grid: { display: false } } }, plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ` ${plural(ctx.raw, 'vendor')}`, afterLabel: ctx => vs.filter(v => (v.status || 'Not Contacted') === vstat[ctx.dataIndex]).slice(0, 6).map(v => '• ' + v.name).join('\n') } } } } });
}
