/* ---------- Timeline ---------- */
function pageTimeline() {
  const tasks = live('tasks');
  const today = todayISO();
  const wd = weddingDate();
  let nowPhase = null;
  if (wd) PHASES.forEach(p => { const d = phaseDate(p[0]); if (d && d <= today) nowPhase = p[0]; });
  const item = t => { const st = taskState(t); const done = st === 'Completed'; const d = taskDue(t);
    return `<div class="tl-item ${done ? 'done' : ''} ${st === 'Overdue' ? 'overdue' : ''}" data-act="edit" data-col="tasks" data-id="${t.id}" tabindex="0">
      <button class="tick ${done ? 'on' : ''}" data-act="toggle-task" data-id="${t.id}" aria-label="${done ? 'Mark as not done' : 'Mark as done'}">${done ? ic('check') : ''}</button>
      <div class="tx"><b>${esc(t.title)}</b><small>${esc(t.category || '')}${d ? ' · due ' + fmtDate(d) + (t.deadline ? '' : ' (auto)') : ''}${st === 'Overdue' ? ' · overdue' : ''}</small></div>
      ${personPill(t.pic)} <span class="pill ${statusPillCls(st)}">${esc(t.status === 'Completed' ? 'Done' : st)}</span></div>`; };
  const phases = PHASES.map(p => {
    const list = tasks.filter(t => t.phase === p[0]).sort((a, b) => (taskDue(a) || '').localeCompare(taskDue(b) || '') || (a.title || '').localeCompare(b.title || ''));
    const d = phaseDate(p[0]);
    const cls = nowPhase === p[0] ? 'now' : d && d < today ? 'past' : '';
    const pr = progressOf(list);
    return `<div class="tl-phase ${cls}"><div class="tl-when"><b>${esc(p[1])}</b><small>${d ? fmtDate(d) : 'Set wedding date'}</small>${list.length ? `<small style="display:block">${pr.done}/${pr.total} done</small>` : ''}</div>
      <div class="tl-items">${list.map(item).join('')}<div><button class="btn sm ghost" data-act="add" data-col="tasks" data-preset='${esc(JSON.stringify({ phase: p[0] }))}'>${ic('plus')} Add task</button></div></div></div>`;
  }).join('');
  const loose = tasks.filter(t => !t.phase || !PHASE_LABEL[t.phase]);
  return pageHead('Wedding Timeline', wd ? `Counting back from ${esc(fmtDateLong(wd))}. Deadlines follow each phase unless a task has its own deadline.` : 'Set the wedding date in Wedding Overview so each phase gets a real date.', addBtn('tasks', 'Add task')) +
    (!wd ? `<div class="warnbox warn">${ic('alert')}<div>No wedding date yet — phases show without dates. <button class="btn sm" data-act="go" data-page="overview">Set the date</button></div></div>` : '') +
    (tasks.length ? `<div class="card"><div class="tl">${phases}</div></div>` : `<div class="card">${emptyState('No timeline tasks yet', 'Load the starter template from the Dashboard, or add your first task.', addBtn('tasks', 'Add task'))}</div>`) +
    (loose.length ? `<div class="card"><h3>Tasks without a timeline phase</h3><div class="tl-items" style="margin-top:10px">${loose.map(item).join('')}</div></div>` : '');
}

/* ---------- Checklist ---------- */
function pageChecklist() {
  const all = live('tasks');
  const rows = all.filter(t => matchQ('tasks', t, ['title', 'description', 'notes', 'category']) &&
    (!UI.flt.tcat || t.category === UI.flt.tcat) && (!UI.flt.tpic || t.pic === UI.flt.tpic) && (!UI.flt.tstatus || t.status === UI.flt.tstatus) &&
    (!UI.flt.tprio || t.priority === UI.flt.tprio) && (!F.taskState || taskState(t) === F.taskState));
  const overdue = all.filter(t => taskState(t) === 'Overdue').length;
  const soon = all.filter(t => { const d = taskDue(t); const s = taskState(t); return s !== 'Completed' && s !== 'Cancelled' && s !== 'Overdue' && d && daysBetween(todayISO(), d) <= 7; }).length;
  const pr = progressOf(all);
  return pageHead('Master Checklist', `${pr.done} of ${pr.total} tasks complete · <span class="neg">${overdue} overdue</span> · ${soon} due within 7 days`, addBtn('tasks', 'Add task')) +
    fChips(['taskState']) +
    `<div class="toolbar">${searchBox('tasks', 'Search tasks…')}${filterSelect('tcat', 'Category', TASK_CATS)}${filterSelect('tpic', 'PIC', PIC)}${filterSelect('tstatus', 'Status', TASK_STATUS)}${filterSelect('tprio', 'Priority', PRIORITY)}${filterSelect('taskState', 'Timing', ['Overdue', 'Pending', 'In Progress', 'Completed'], 'F')}<span class="tcount">${plural(rows.length, 'task')}</span></div>` +
    table({ id: 'tasks', col: 'tasks', rows, rowCls: taskRowCls,
      empty: all.length ? emptyState('No tasks match', 'Try clearing the search or filters.') : emptyState('No tasks yet', 'Load the starter template from the Dashboard or add a task.', addBtn('tasks', 'Add task')),
      cols: [
        { k: 'title', label: 'Task', render: r => `<span class="title">${esc(r.title)}</span>${r.description ? `<div class="sub">${esc(r.description.slice(0, 90))}</div>` : ''}<div class="sub">${esc(PHASE_LABEL[r.phase] || '')}</div>` },
        { k: 'category', label: 'Category' },
        { k: 'pic', label: 'PIC', render: r => personPill(r.pic) },
        { k: 'priority', label: 'Priority', sort: r => PRIORITY.indexOf(r.priority), render: r => r.priority ? `<span class="pill prio-${esc(r.priority)}">${esc(r.priority)}</span>` : '' },
        { k: 'due', label: 'Deadline', sort: r => taskDue(r), render: r => { const d = taskDue(r); const st = taskState(r); return d ? `${fmtDate(d)}${r.deadline ? '' : ' <span class="sub">(phase)</span>'}${st === 'Overdue' ? '<div class="sub neg">Overdue</div>' : ''}` : '—'; } },
        { k: 'status', label: 'Status', render: r => `<select class="inline-select" data-change="quick" data-col="tasks" data-id="${r.id}" data-k="status" aria-label="Status">${TASK_STATUS.map(s => `<option ${s === r.status ? 'selected' : ''}>${s}</option>`).join('')}</select>` },
        { k: 'completedAt', label: 'Completed', render: r => fmtDate(r.completedAt) || '—' },
      ] });
}

/* ---------- To-Do ---------- */
function pageTodo() {
  const all = live('todos');
  const show = UI.flt.todoShow || 'open';
  const rows = all.filter(t => (show === 'all' || (show === 'open' ? !t.done : t.done)) && (!UI.flt.todopic || t.pic === UI.flt.todopic) && matchQ('todos', t, ['title', 'notes']))
    .sort((a, b) => (a.done - b.done) || (a.due || '9999').localeCompare(b.due || '9999') || PRIORITY.indexOf(a.priority) - PRIORITY.indexOf(b.priority));
  const today = todayISO();
  return pageHead('Quick To-Do', `${all.filter(t => !t.done).length} open · ${all.filter(t => t.done).length} done. For small things that don't need the full checklist.`) +
    `<form class="card row" id="todoQuick" style="gap:10px"><input class="input" id="tq_title" style="flex:3;min-width:200px" placeholder="Add a quick to-do and press Enter…" aria-label="New to-do">
      <select class="input" id="tq_pic" style="flex:1;min-width:110px" aria-label="PIC">${PIC.map(p => `<option ${p === ME ? 'selected' : ''}>${p}</option>`).join('')}</select>
      <input class="input" id="tq_due" type="date" style="flex:1;min-width:140px" aria-label="Due date">
      <button class="btn primary" type="submit">${ic('plus')} Add</button></form>
    <div class="toolbar"><div class="chips">${[['open', 'Open'], ['done', 'Done'], ['all', 'All']].map(([k, l]) => `<button class="chip ${show === k ? 'on' : ''}" data-act="set-flt" data-k="todoShow" data-v="${k}">${l}</button>`).join('')}</div>${searchBox('todos', 'Search to-dos…')}${filterSelect('todopic', 'PIC', PIC)}</div>
    <div class="card" style="padding:6px 8px">${rows.length ? rows.map(t => `<div class="tl-item ${t.done ? 'done' : ''} ${!t.done && t.due && t.due < today ? 'overdue' : ''}" style="border:0;border-bottom:1px solid var(--line2);border-radius:0" data-act="edit" data-col="todos" data-id="${t.id}" tabindex="0">
      <button class="tick ${t.done ? 'on' : ''}" data-act="toggle-todo" data-id="${t.id}" aria-label="Toggle done">${t.done ? ic('check') : ''}</button>
      <div class="tx"><b>${esc(t.title)}</b><small>${t.due ? (t.due < today && !t.done ? '<span class="neg">Overdue · </span>' : '') + 'Due ' + fmtDate(t.due) : 'No due date'}${t.notes ? ' · ' + esc(t.notes.slice(0, 60)) : ''}</small></div>
      ${t.priority && t.priority !== 'Medium' ? `<span class="pill prio-${esc(t.priority)}">${esc(t.priority)}</span>` : ''}${personPill(t.pic)}
      <button class="icon-btn" data-act="del" data-col="todos" data-id="${t.id}" aria-label="Delete">${ic('trash')}</button></div>`).join('') : emptyState(show === 'done' ? 'Nothing completed yet' : 'No open to-dos', 'Type above to add one.')}</div>`;
}

/* ---------- Budget ---------- */
function pageBudget() {
  const tot = budgetTotals();
  const tab = UI.budgetTab;
  const util = tot.target > 0 ? Math.round(tot.utilization * 100) : null;
  const strip = `<section class="kpis">
    ${statTile('Target budget', tot.target ? fmtMoney(tot.target) : '—', tot.target ? '' : '<a href="#overview" data-act="go" data-page="overview">Set in Wedding Overview</a>')}
    ${statTile('Allocated to categories', fmtMoney(tot.allocated), tot.target ? `${pct(tot.allocated, tot.target)}% of target · ${tot.allocated > tot.target ? '<span class="neg">over-allocated</span>' : fmtMoney(tot.target - tot.allocated) + ' unallocated'}` : '')}
    ${statTile('Estimate range', `${fmtMoney(tot.minEst, true)} – ${fmtMoney(tot.maxEst, true)}`, 'Sum of item min / max estimates')}
    ${statTile('Actual spending', fmtMoney(tot.actual), util !== null ? `${util}% of target used` : 'Agreed costs')}
    ${statTile('Total paid', fmtMoney(tot.paid), 'From payment records')}
    ${statTile('Outstanding', fmtMoney(tot.outstanding), 'Actual cost − paid', tot.outstanding > 0 ? '' : '')}
    ${statTile('Remaining budget', tot.target ? fmtMoney(tot.remaining) : '—', 'Target − actual spending', tot.target && tot.remaining < 0 ? 'alert' : '')}
    ${statTile('Budget utilisation', util !== null ? util + '%' : '—', `<div class="bar" style="margin-top:4px"><i style="width:${Math.min(100, util || 0)}%;${util > 100 ? 'background:var(--bad)' : ''}"></i></div>`)}
  </section>`;
  const tabs = `<div class="chips" role="tablist">${[['items', 'Budget items'], ['categories', 'By category'], ['payments', 'Payments']].map(([k, l]) => `<button class="chip ${tab === k ? 'on' : ''}" role="tab" aria-selected="${tab === k}" data-act="budget-tab" data-v="${k}">${l}</button>`).join('')}</div>`;
  let body = '';
  if (tab === 'items') {
    const rows = budgetRows().filter(r => (!F.budgetCat || r.category === F.budgetCat) && (!F.payStatus || r._d.status === F.payStatus) && (!UI.flt.bpic || r.pic === UI.flt.bpic) && matchQ('budget', r, ['name', 'code', 'description', 'notes', 'category']));
    const sum = k => rows.reduce((s, r) => s + (typeof k === 'function' ? k(r) : num(r[k])), 0);
    body = fChips(['budgetCat', 'payStatus']) + `<div class="toolbar">${searchBox('budget', 'Search budget items…')}${filterSelect('budgetCat', 'Category', BUDGET_CATS, 'F')}${filterSelect('payStatus', 'Payment', PAY_STATUS.concat(['Not priced']), 'F')}${filterSelect('bpic', 'PIC', PIC)}<span class="spacer"></span><button class="btn" data-act="export" data-what="budget">${ic('download')} CSV</button>${addBtn('budget', 'Add item', F.budgetCat ? { category: F.budgetCat } : null)}</div>` +
      table({ id: 'budget', col: 'budget', rows, rowCls: r => r._d.status === 'Overdue' ? 'overdue' : '',
        empty: emptyState('No budget items', 'Add items or load the starter template from the Dashboard.', addBtn('budget', 'Add item')),
        cols: [
          { k: 'code', label: 'ID' },
          { k: 'name', label: 'Item', render: r => `<span class="title">${esc(r.name)}</span><div class="sub">${esc(r.category)}${r.vendorId && byId('vendors', r.vendorId) ? ' · ' + esc(byId('vendors', r.vendorId).name) : ''}</div>` },
          { k: 'estimate', label: 'Estimate (min–max)', money: true, sort: r => num(r.maxEst), render: r => num(r.minEst) || num(r.maxEst) ? `${fmtMoney(r.minEst, true)} – ${fmtMoney(r.maxEst, true)}` : '—' },
          { k: 'allocated', label: 'Allocated', money: true, sort: r => r._d.allocated, render: r => r._d.allocated ? fmtMoney(r._d.allocated) : '—' },
          { k: 'actual', label: 'Actual', money: true, sort: r => r._d.actual, render: r => r._d.actual ? fmtMoney(r._d.actual) : '—' },
          { k: 'variance', label: 'Variance', money: true, sort: r => r._d.variance, render: r => r._d.allocated || r._d.actual ? `<span class="${r._d.variance < 0 ? 'neg' : ''}">${fmtMoney(r._d.variance)}</span>` : '—' },
          { k: 'paid', label: 'Paid', money: true, sort: r => r._d.paid, render: r => r._d.paid ? fmtMoney(r._d.paid) + (r._d.deposit ? `<div class="sub">deposit ${fmtMoney(r._d.deposit, true)}</div>` : '') : '—' },
          { k: 'outstanding', label: 'Outstanding', money: true, sort: r => r._d.outstanding, render: r => r._d.outstanding ? `<b>${fmtMoney(r._d.outstanding)}</b>` : (r._d.credit ? `<span class="sub">credit ${fmtMoney(r._d.credit)}</span>` : '—') },
          { k: 'paymentDeadline', label: 'Pay by', render: r => fmtDate(r.paymentDeadline) || '—' },
          { k: 'status', label: 'Status', sort: r => r._d.status, render: r => `<span class="pill ${payPillCls(r._d.status)}">${r._d.status}</span>` },
        ],
        foot: ['', `Total · ${rows.length} items`, `${fmtMoney(sum('minEst'), true)} – ${fmtMoney(sum('maxEst'), true)}`, fmtMoney(sum(r => r._d.allocated)), fmtMoney(sum(r => r._d.actual)), fmtMoney(sum(r => r._d.variance)), fmtMoney(sum(r => r._d.paid)), fmtMoney(sum(r => r._d.outstanding)), '', ''] });
  } else if (tab === 'categories') {
    const cats = categoryTable();
    const s = k => cats.reduce((a, c) => a + c[k], 0);
    body = `<div class="warnbox info">${ic('info')}<div>Type a <b>category budget</b> to set the allocation for a whole category. If you leave it empty, the category budget is the sum of its items' allocated budgets. Totals never add both, so nothing is counted twice.</div></div>` +
      `<div class="table-wrap cards"><table class="t"><thead><tr><th class="nosort">Category</th><th class="nosort money">Category budget</th><th class="nosort money">Items allocated</th><th class="nosort money">Estimate (min–max)</th><th class="nosort money">Actual</th><th class="nosort money">Variance</th><th class="nosort money">Paid</th><th class="nosort money">Outstanding</th><th class="nosort">Used</th></tr></thead><tbody>
      ${cats.map(c => `<tr data-act="cat-open" data-v="${esc(c.cat)}"><td data-label="Category"><span class="title">${esc(c.cat)}</span><div class="sub">${plural(c.items, 'item')}</div></td>
        <td data-label="Category budget" class="money">${c.cat === 'Uncategorised' ? '—' : `<input class="input num" style="max-width:150px;text-align:right;min-height:34px;padding:5px 8px" data-money data-change="cat-alloc" data-k="${esc(c.cat)}" value="${c.setAlloc ? fmtNum(c.setAlloc) : ''}" placeholder="${c.itemsAlloc ? fmtNum(c.itemsAlloc) : '0'}" aria-label="Budget for ${esc(c.cat)}">`}</td>
        <td data-label="Items allocated" class="money">${c.itemsAlloc ? fmtMoney(c.itemsAlloc) : '—'}</td>
        <td data-label="Estimate" class="money">${c.minEst || c.maxEst ? `${fmtMoney(c.minEst, true)} – ${fmtMoney(c.maxEst, true)}` : '—'}</td>
        <td data-label="Actual" class="money">${c.actual ? fmtMoney(c.actual) : '—'}</td>
        <td data-label="Variance" class="money ${c.variance < 0 ? 'neg' : ''}">${c.budget || c.actual ? fmtMoney(c.variance) : '—'}</td>
        <td data-label="Paid" class="money">${c.paid ? fmtMoney(c.paid) : '—'}</td>
        <td data-label="Outstanding" class="money">${c.outstanding ? fmtMoney(c.outstanding) : '—'}</td>
        <td data-label="Used" style="min-width:90px">${c.budget ? `<div class="bar ${c.actual > c.budget ? 'pink' : ''}"><i style="width:${Math.min(100, pct(c.actual, c.budget))}%"></i></div><div class="sub">${pct(c.actual, c.budget)}%</div>` : '—'}</td></tr>`).join('')}
      </tbody><tfoot><tr><td>Total</td><td class="money">${fmtMoney(s('budget'))}</td><td class="money">${fmtMoney(s('itemsAlloc'))}</td><td class="money">${fmtMoney(s('minEst'), true)} – ${fmtMoney(s('maxEst'), true)}</td><td class="money">${fmtMoney(s('actual'))}</td><td class="money">${fmtMoney(s('variance'))}</td><td class="money">${fmtMoney(s('paid'))}</td><td class="money">${fmtMoney(s('outstanding'))}</td><td></td></tr></tfoot></table></div>`;
  } else {
    const months = [...new Set(live('payments').map(p => monthKey(p.date)).filter(Boolean))].sort();
    const rows = live('payments').filter(p => { const b = byId('budget', p.budgetId); return (!F.month || monthKey(p.date) === F.month) && (!F.budgetCat || (b && b.category === F.budgetCat)) && (!UI.flt.ptype || p.type === UI.flt.ptype) && matchQ('payments', p, ['code', 'notes', 'method', r => (byId('budget', r.budgetId) || {}).name]); });
    const total = rows.reduce((s, p) => s + paySigned(p), 0);
    body = fChips(['month', 'budgetCat']) + `<div class="toolbar">${searchBox('payments', 'Search payments…')}${filterSelect('month', 'Month', months.map(m => [m, fmtMonth(m)]), 'F')}${filterSelect('budgetCat', 'Category', BUDGET_CATS, 'F')}${filterSelect('ptype', 'Type', PAY_TYPES)}<span class="spacer"></span><button class="btn" data-act="export" data-what="payments">${ic('download')} CSV</button><button class="btn primary" data-act="add-payment">${ic('plus')} Add payment</button></div>` +
      `<div class="small muted">Each payment is linked to one budget item. An item's paid amount and outstanding balance are calculated from these records, so deposits and instalments are counted exactly once.</div>` +
      table({ id: 'payments', col: 'payments', rows,
        empty: emptyState('No payments recorded', live('budget').length ? 'Record deposits, instalments and final payments here.' : 'Add budget items first, then record payments against them.', `<button class="btn primary" data-act="add-payment">${ic('plus')} Add payment</button>`),
        cols: [
          { k: 'code', label: 'ID' }, { k: 'date', label: 'Date', render: r => fmtDate(r.date) },
          { k: 'item', label: 'Budget item', sort: r => (byId('budget', r.budgetId) || {}).name, render: r => { const b = byId('budget', r.budgetId); return b ? `<span class="title">${esc(b.name)}</span><div class="sub">${esc(b.category)}${b.deleted ? ' · item in Trash (not counted)' : ''}</div>` : '<span class="neg">Missing item</span>'; } },
          { k: 'type', label: 'Type', render: r => `<span class="pill ${r.type === 'Refund' ? 'warn' : r.type === 'Deposit' ? 'info' : r.type === 'Final Payment' ? 'ok' : ''}">${esc(r.type)}</span>` },
          { k: 'method', label: 'Method' },
          { k: 'amount', label: 'Amount', money: true, sort: r => paySigned(r), render: r => `<span class="${r.type === 'Refund' ? 'neg' : ''}">${r.type === 'Refund' ? '−' : ''}${fmtMoney(r.amount)}</span>` },
          { k: 'by', label: 'Recorded by', render: r => personPill(r.createdBy) },
        ], foot: ['', '', `Total · ${rows.length} payments`, '', '', fmtMoney(total), ''] });
  }
  return pageHead('Budget', 'Allocated budget − actual cost = variance · actual cost − payments = outstanding · target − actual spending = remaining.') + strip + tabs + body;
}

/* ---------- Vendors ---------- */
function pageVendors() {
  const all = live('vendors');
  const rows = all.filter(v => (!F.vendorCat || v.category === F.vendorCat) && (!F.vendorStatus || v.status === F.vendorStatus) && matchQ('vendors', v, ['name', 'packageName', 'contact', 'notes', 'category']));
  const view = UI.vendView;
  const counts = Object.fromEntries(VENDOR_CATS.map(c => [c, all.filter(v => v.category === c)]));
  const catChips = `<div class="chips"><button class="chip ${!F.vendorCat ? 'on' : ''}" data-act="set-f" data-k="vendorCat" data-v="">All</button>${VENDOR_CATS.map(c => `<button class="chip ${F.vendorCat === c ? 'on' : ''}" data-act="set-f" data-k="vendorCat" data-v="${esc(c)}">${esc(c)}${counts[c].length ? ` <span class="muted" style="${F.vendorCat === c ? 'color:inherit;opacity:.8' : ''}">${counts[c].length}</span>` : ''}${counts[c].some(v => v.status === 'Booked') ? ' ✓' : ''}</button>`).join('')}</div>`;
  const toolbar = `<div class="toolbar">${searchBox('vendors', 'Search vendors…')}${filterSelect('vendorStatus', 'Status', VENDOR_STATUS, 'F')}<span class="spacer"></span><div class="chips"><button class="chip ${view === 'compare' ? 'on' : ''}" data-act="vend-view" data-v="compare">Side by side</button><button class="chip ${view === 'table' ? 'on' : ''}" data-act="vend-view" data-v="table">Table</button></div><button class="btn" data-act="export" data-what="vendors">${ic('download')} CSV</button>${addBtn('vendors', 'Add vendor', F.vendorCat ? { category: F.vendorCat } : null)}</div>`;
  let body;
  if (view === 'table') {
    body = table({ id: 'vendors', col: 'vendors', rows, empty: emptyState('No vendors yet', 'Add up to three candidates per category (or more) to compare them.', addBtn('vendors', 'Add vendor')), cols: [
      { k: 'name', label: 'Vendor', render: r => `<span class="title">${esc(r.name)}</span><div class="sub">${esc(r.packageName || '')}</div>` },
      { k: 'category', label: 'Category' },
      { k: 'price', label: 'Price', money: true, sort: vendorPrice, render: r => vendorPrice(r) ? fmtMoney(vendorPrice(r)) + (num(r.negotiatedPrice) && num(r.quotedPrice) && num(r.negotiatedPrice) !== num(r.quotedPrice) ? `<div class="sub"><s>${fmtMoney(r.quotedPrice)}</s></div>` : '') : '—' },
      { k: 'remaining', label: 'Remaining', money: true, sort: vendorRemaining, render: r => vendorPrice(r) ? fmtMoney(vendorRemaining(r)) : '—' },
      { k: 'availability', label: 'Availability' },
      { k: 'bookingDeadline', label: 'Book by', render: r => fmtDate(r.bookingDeadline) || '—' },
      { k: 'contractStatus', label: 'Contract' },
      { k: 'status', label: 'Status', render: r => `<select class="inline-select" data-change="vendor-status" data-id="${r.id}" aria-label="Status">${VENDOR_STATUS.map(s => `<option ${s === r.status ? 'selected' : ''}>${s}</option>`).join('')}</select>` },
    ] });
  } else {
    const cats = (F.vendorCat ? [F.vendorCat] : VENDOR_CATS).filter(c => rows.some(v => v.category === c));
    const emptyCats = (F.vendorCat ? [F.vendorCat] : VENDOR_CATS).filter(c => !counts[c].length);
    body = cats.map(c => {
      const list = rows.filter(v => v.category === c).sort((a, b) => VENDOR_STATUS.indexOf(a.status) === 3 ? -1 : VENDOR_STATUS.indexOf(b.status) === 3 ? 1 : (a.createdAt || '').localeCompare(b.createdAt || ''));
      return `<section class="grid" style="gap:10px"><div class="row"><h3 style="font-size:18px">${esc(c)}</h3><span class="tcount">${plural(list.length, 'candidate')}</span>${list.some(v => v.status === 'Booked') ? '<span class="pill ok">Booked</span>' : ''}<span class="spacer"></span><button class="btn sm" data-act="add" data-col="vendors" data-preset='${esc(JSON.stringify({ category: c }))}'>${ic('plus')} Add candidate</button></div>
      <div class="compare">${list.map(vendorCard).join('')}</div></section>`;
    }).join('') || (all.length ? `<div class="card">${emptyState('No vendors match', 'Clear the filters to see all candidates.')}</div>` : '');
    if (emptyCats.length && !F.vendorStatus && !UI.q.vendors) body += `<div class="card"><h3>No candidates yet</h3><div class="hint">Add up to three candidates per category to start comparing. You choose the winner — nothing is picked automatically.</div><div class="chips" style="margin-top:12px">${emptyCats.map(c => `<button class="chip" data-act="add" data-col="vendors" data-preset='${esc(JSON.stringify({ category: c }))}'>${ic('plus', 'width="14" height="14"')} ${esc(c)}</button>`).join('')}</div></div>`;
  }
  return pageHead('Vendor Comparison', 'Compare candidates side by side. Marking a vendor as Booked links it to the budget so its payments and deadlines show up in reminders.') + catChips + fChips(['vendorStatus']) + toolbar + body;
}
function vendorCard(v) {
  const price = vendorPrice(v);
  const dd = (k, val) => val ? `<dt>${k}</dt><dd>${val}</dd>` : '';

      ${dd('Availability', esc(v.availability || ''))}${dd('Book by', fmtDate(v.bookingDeadline))}${dd('Payment terms', esc(v.paymentTerms || ''))}${dd('Contract', esc(v.contractStatus || ''))}${dd('Contact', esc([v.contact, v.phone].filter(Boolean).join(' · ')))}${dd('Instagram / web', esc(v.social || ''))}</dl>

}

/* ---------- Guests ---------- */
function pageGuests() {
  const st = settings(); const gs = guestStats();
  const tPacks = num(st.targetPacks), tAtt = num(st.targetAttendees);
  const all = live('guests');
  const rows = all.filter(g => (!F.guestOwner || g.owner === F.guestOwner) && (!F.rsvp || (g.rsvp || 'Pending') === F.rsvp) && (!UI.flt.grel || g.relation === UI.flt.grel) && (!UI.flt.ginv || g.invStatus === UI.flt.ginv) && (!UI.flt.gtype || g.invType === UI.flt.gtype) && matchQ('guests', g, ['name', 'code', 'notes', 'table']));
  const warns = [];
  if (tPacks && gs.packs > tPacks) warns.push(['bad', `${gs.packs} invitation packs — ${gs.packs - tPacks} over the target of ${tPacks}.`]);
  else if (tPacks && gs.packs > tPacks * .9) warns.push(['warn', `${gs.packs} of ${tPacks} invitation packs used (${pct(gs.packs, tPacks)}%).`]);
  if (tAtt && gs.expected > tAtt) warns.push(['bad', `Expected attendees (${gs.expected}) exceed the target of ${tAtt} by ${gs.expected - tAtt}.`]);
  else if (tAtt && gs.expected > tAtt * .9) warns.push(['warn', `Expected attendees ${gs.expected} are close to the target of ${tAtt}.`]);
  if (!tAtt) warns.push(['info', 'Set a target number of attendees in Wedding Overview to get capacity warnings for people, not just packs.']);
  const tiles = `<section class="kpis">
    ${statTile('Invitation packs', `${gs.packs}${tPacks ? ` <span class="muted" style="font-size:14px">/ ${tPacks}</span>` : ''}`, tPacks ? `<div class="bar"><i style="width:${Math.min(100, pct(gs.packs, tPacks))}%;${gs.packs > tPacks ? 'background:var(--bad)' : ''}"></i></div>` : '', tPacks && gs.packs > tPacks ? 'alert' : '')}
    ${statTile('Total people invited', fmtNum(gs.people), 'Adults + children')}
    ${statTile('Expected attendees', `${fmtNum(gs.expected)}${tAtt ? ` <span class="muted" style="font-size:14px">/ ${tAtt}</span>` : ''}`, 'Attending + pending (declined excluded)', tAtt && gs.expected > tAtt ? 'alert' : '')}
    ${statTile('Confirmed attending', fmtNum(gs.confirmed), `${gs.attendingPacks} packs · ${gs.sent} invitations sent`)}
  </section>`;
  return pageHead('Guest List & RSVP', 'An invitation pack is one household or invitation; people are counted from adults and children.', `<button class="btn" data-act="guest-import">${ic('upload')} Import CSV</button><button class="btn" data-act="export" data-what="guests">${ic('download')} Export CSV</button>${addBtn('guests', 'Add guest', F.guestOwner ? { owner: F.guestOwner } : null)}`) +
    tiles + warns.map(w => `<div class="warnbox ${w[0]}">${ic(w[0] === 'info' ? 'info' : 'alert')}<div>${esc(w[1])}</div></div>`).join('') + fChips(['guestOwner', 'rsvp']) +
    `<div class="toolbar">${searchBox('guests', 'Search guests…')}${filterSelect('guestOwner', 'Owner', PIC, 'F')}${filterSelect('rsvp', 'RSVP', RSVP, 'F')}${filterSelect('grel', 'Category', REL_CATS)}${filterSelect('ginv', 'Invitation', ['Not Sent', 'Sent'])}${filterSelect('gtype', 'Type', ['Digital', 'Printed'])}<span class="tcount">${plural(rows.length, 'pack')} · ${fmtNum(rows.reduce((s, g) => s + guestTotal(g), 0))} people</span></div>` +
    table({ id: 'guests', col: 'guests', rows, empty: all.length ? emptyState('No guests match', 'Clear the filters to see everyone.') : emptyState('No guests yet', 'Add guests one by one or import a CSV file.', addBtn('guests', 'Add guest')), cols: [
      { k: 'code', label: 'ID' },
      { k: 'name', label: 'Guest', render: r => `<span class="title">${esc(r.name)}</span>${r.notes ? `<div class="sub">${esc(r.notes.slice(0, 60))}</div>` : ''}` },
      { k: 'people', label: 'People', sort: guestTotal, render: r => `${guestTotal(r)}<div class="sub">${num(r.adults)}A${num(r.children) ? ' · ' + num(r.children) + 'C' : ''}</div>` },
      { k: 'owner', label: 'Owner', render: r => personPill(r.owner) },
      { k: 'relation', label: 'Category' },
      { k: 'inv', label: 'Invitation', sort: r => r.invStatus, render: r => `<span class="pill ${r.invStatus === 'Sent' ? 'ok' : ''}">${esc(r.invStatus || 'Not Sent')}</span><div class="sub">${esc(r.invType || '')}${r.sentDate ? ' · ' + fmtDate(r.sentDate) : ''}</div>` },
      { k: 'rsvp', label: 'RSVP', render: r => `<select class="inline-select" data-change="quick" data-col="guests" data-id="${r.id}" data-k="rsvp" aria-label="RSVP">${RSVP.map(s => `<option ${s === (r.rsvp || 'Pending') ? 'selected' : ''}>${s}</option>`).join('')}</select>` },
      { k: 'confirmed', label: 'Confirmed', sort: guestConfirmed, render: r => r.rsvp === 'Attending' ? guestConfirmed(r) : '—' },
      { k: 'table', label: 'Table' },
    ] });
}

/* ---------- Rundown ---------- */
function pageRundown() {
  const rows = rundownRows();
  const dates = [...new Set(rows.map(r => r._date))];
  const conflicts = rows.filter(r => r._conflicts.length).length;
  const vendName = id => (byId('vendors', id) || {}).name || '';
  const body = dates.map(d => {
    const list = rows.filter(r => r._date === d);
    return `<section class="grid" style="gap:10px"><h3 style="font-size:18px">${d ? esc(fmtDateLong(d)) : 'Wedding day (date not set)'}</h3>` + table({ id: 'rundown' + d, col: 'rundown', rows: list, rowCls: r => r._conflicts.length ? 'overdue' : r._overlaps.length ? 'soon' : '', cols: [
      { k: 'time', label: 'Time', nosort: true, render: r => `<b class="num">${esc(r.start || '—')}${r._e != null ? '–' + minToTime(r._e) : ''}</b>${r._dur ? `<div class="sub">${r._dur} min</div>` : ''}` },
      { k: 'activity', label: 'Activity', nosort: true, render: r => `<span class="title">${esc(r.activity)}</span>${r.segment ? `<div class="sub">${esc(r.segment)}</div>` : ''}${r._conflicts.length ? `<div class="sub neg">Conflict with: ${esc(r._conflicts.join(', '))}</div>` : ''}${r._overlaps.length ? `<div class="sub" style="color:var(--warn)">Runs alongside: ${esc(r._overlaps.join(', '))}</div>` : ''}` },
      { k: 'location', label: 'Location', nosort: true }, { k: 'pic', label: 'PIC', nosort: true },
      { k: 'vendor', label: 'Vendor', nosort: true, render: r => esc(vendName(r.vendorId)) || '—' },
      { k: 'equipment', label: 'Equipment', nosort: true },
      { k: 'status', label: 'Status', nosort: true, render: r => `<span class="pill ${statusPillCls(r.status)}">${esc(r.status || 'Planned')}</span>` },
    ] }) + '</section>';
  }).join('');
  return pageHead('Wedding Rundown', 'End times are calculated from start time + duration. Items at the same time in the same location, or with the same PIC or vendor, are flagged as conflicts.', addBtn('rundown', 'Add activity')) +
    (conflicts ? `<div class="warnbox bad">${ic('alert')}<div>${plural(conflicts, 'activity')} have schedule conflicts (same location, PIC or vendor at the same time).</div></div>` : rows.length ? `<div class="warnbox ok">${ic('check')}<div>No schedule conflicts. Activities marked in amber simply run in parallel.</div></div>` : '') +
    (rows.length ? body : `<div class="card">${emptyState('No rundown yet', 'Load the starter template from the Dashboard or add the first activity.', addBtn('rundown', 'Add activity'))}</div>`);
}

/* ---------- Activity ---------- */
const FIELD_LABELS = (() => { const m = {}; Object.values(SCHEMAS).forEach(s => { const fs = typeof s.fields === 'function' ? s.fields(null) : s.fields; fs.forEach(f => { if (f.k) m[f.k] = f.label; }); }); OVERVIEW_FIELDS.forEach(f => { if (f.k) m[f.k] = f.label; }); m.deleted = 'Deleted'; m.catAlloc = 'Category budgets'; m.pwHash = 'Password'; return m; })();
function pageActivity() {
  const acts = live('activity').sort((a, b) => (b.ts || '').localeCompare(a.ts || ''));
  const rows = acts.filter(a => (!UI.flt.auser || a.user === UI.flt.auser) && (!UI.flt.acol || a.col === UI.flt.acol) && matchQ('activity', a, ['label', 'user', 'action', 'note']));
  const shown = rows.slice(0, UI.actLimit || 60);
  const verb = { added: 'added', updated: 'updated', deleted: 'deleted', restored: 'restored', reverted: 'undid a change to' };
  const trash = COLLECTIONS.filter(c => c !== 'activity' && c !== 'meta').flatMap(c => S.data[c].filter(r => r.deleted).map(r => ({ col: c, r }))).sort((a, b) => (b.r.deletedAt || '').localeCompare(a.r.deletedAt || ''));
  const fmtChange = c => { const lab = FIELD_LABELS[c.f] || c.f; if (c.f === 'pwHash') return `<div>${esc(lab)} changed</div>`; return `<div>${esc(lab)}: ${c.from !== '' ? `<s>${esc(c.from)}</s> → ` : ''}${c.to !== '' ? esc(c.to) : '<i>empty</i>'}</div>`; };
  return pageHead('Activity History', 'Every change, who made it and when. Undo restores the version before a change.') +
    `<div class="toolbar">${searchBox('activity', 'Search activity…')}${filterSelect('auser', 'Person', ['Fina', 'Unzi', 'System'])}${filterSelect('acol', 'Section', Object.keys(COL_NAMES).map(c => [c, COL_NAMES[c]]))}<span class="spacer"></span><button class="btn" data-act="toggle-trash">${ic('trash')} Trash (${trash.length})</button></div>` +
    (UI.trashOpen ? `<div class="card"><div class="card-head"><div><h3>Trash</h3><div class="hint">Deleted records stay here until you delete them forever.</div></div>${trash.length ? `<button class="btn danger" data-act="empty-trash">Empty trash</button>` : ''}</div>
      ${trash.length ? `<div class="log">${trash.map(({ col, r }) => `<div class="log-item"><div class="av ${String(r.deletedBy || '').toLowerCase() || 'sys'}">${esc((r.deletedBy || 'S')[0])}</div><div><b>${esc(recLabel(col, r))}</b><div class="d">${esc(COL_NAMES[col])} · deleted by ${esc(r.deletedBy || '—')} · ${esc(fmtTs(r.deletedAt))}</div></div><div class="row"><button class="btn sm" data-act="restore" data-col="${col}" data-id="${r.id}">${ic('undo')} Restore</button><button class="btn sm danger" data-act="purge" data-col="${col}" data-id="${r.id}">Delete forever</button></div></div>`).join('')}</div>` : '<div class="muted small">Trash is empty.</div>'}</div>` : '') +
    `<div class="card">${shown.length ? `<div class="log">${shown.map(a => {
      const who = (a.user || 'System'); const cls = who === 'Fina' ? 'fina' : who === 'Unzi' ? 'unzi' : 'sys';
      const rec = byId(a.col, a.recId);
      const canUndo = ['added', 'updated', 'deleted', 'restored'].includes(a.action) && rec && a.col !== 'activity' && !(a.col === 'meta' && a.action === 'added');

        <div class="d">${esc(fmtTs(a.ts))}${a.note ? ' · ' + esc(a.note) : ''}</div>${a.changes && a.changes.length ? `<div class="chg">${a.changes.map(fmtChange).join('')}</div>` : ''}</div>

}

function parseCSV(text) {

    else if (c === '"') q = true;
    else if (c === delim) { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }

  const m = openModal({ title: 'Import guests from CSV', size: 'sm', dirtyGuard: false,
    body: `<div class="grid" style="gap:12px"><p style="margin:0" class="small">Columns recognised: <b>Guest name</b> (required), Adults, Children, Relationship owner (Fina / Unzi / Both), Relationship category, Invitation type, Invitation status, RSVP, Confirmed attendees, Table, Notes. Comma or semicolon separated (Excel “CSV UTF-8”).</p>
      <div class="row"><button class="btn" data-tpl>${ic('download')} Download template</button><button class="btn primary" data-pick>${ic('upload')} Choose CSV file</button></div><div id="impPrev"></div></div>`,
    footer: `<button class="btn" data-no>Close</button><button class="btn primary" data-go hidden>Import</button>` });
  m.el.querySelector('[data-no]').onclick = () => m.close(true);
  m.el.querySelector('[data-tpl]').onclick = () => saveFile('guest-import-template.csv', toCSV(['Guest name', 'Adults', 'Children', 'Relationship owner', 'Relationship category', 'Invitation type', 'Invitation status', 'RSVP', 'Confirmed attendees', 'Table', 'Notes'], [['Keluarga Pak Ahmad', 2, 1, 'Unzi', 'Family', 'Printed', 'Not Sent', 'Pending', '', '', 'Example row — replace me']]));
  let parsed = [];
  m.el.querySelector('[data-pick]').onclick = async () => {
    const f = await pickFile('.csv,text/csv'); if (!f) return;
    const rows = parseCSV(await f.text()); if (rows.length < 2) { toast('No data rows found in that file.', 'bad'); return; }
    const norm = s => String(s).toLowerCase().replace(/[^a-z]/g, '');
    const hdr = rows[0].map(norm); const idx = {};
    Object.entries(HEAD).forEach(([k, al]) => { const i = hdr.findIndex(h => al.includes(h)); if (i >= 0) idx[k] = i; });
    if (idx.name == null) { $('#impPrev', m.el).innerHTML = `<div class="warnbox bad">${ic('alert')}<div>No “Guest name” column found. Check the header row.</div></div>`; return; }
    const pick = (opts, v, d) => { const f2 = opts.find(o => norm(o) === norm(v)); return f2 || d; };
    const existing = new Set(live('guests').map(g => (g.name || '').trim().toLowerCase()));
    parsed = rows.slice(1).map(r => { const g = k => idx[k] != null ? String(r[idx[k]] ?? '').trim() : ''; return {
      name: g('name'), adults: g('adults') === '' ? 1 : num(g('adults')), children: num(g('children')), owner: pick(PIC, g('owner'), 'Both'), relation: pick(REL_CATS, g('relation'), g('relation') ? 'Others' : 'Family'),
      invType: pick(['Digital', 'Printed'], g('invType'), 'Digital'), invStatus: pick(['Not Sent', 'Sent'], g('invStatus'), 'Not Sent'), rsvp: pick(RSVP, g('rsvp'), 'Pending'),
      confirmed: g('confirmed') === '' ? '' : num(g('confirmed')), table: g('table'), notes: g('notes'), sentDate: /^\d{4}-\d{2}-\d{2}$/.test(g('sentDate')) ? g('sentDate') : '', rsvpDate: /^\d{4}-\d{2}-\d{2}$/.test(g('rsvpDate')) ? g('rsvpDate') : '' }; }).filter(x => x.name);
    const dup = parsed.filter(x => existing.has(x.name.toLowerCase())).length;
    $('#impPrev', m.el).innerHTML = `<div class="warnbox info">${ic('info')}<div><b>${plural(parsed.length, 'guest')}</b> ready · ${fmtNum(parsed.reduce((s, x) => s + guestTotal(x), 0))} people${dup ? ` · <span class="neg">${dup} already on the list by name (they will be added again)</span>` : ''}</div></div><div class="small muted" style="margin-top:8px">${parsed.slice(0, 5).map(x => esc(x.name) + ' · ' + guestTotal(x) + ' · ' + x.owner).join('<br>')}${parsed.length > 5 ? '<br>…' : ''}</div>`;
    m.el.querySelector('[data-go]').hidden = !parsed.length;
  };
  m.el.querySelector('[data-go]').onclick = async () => {
    const btn = m.el.querySelector('[data-go]'); btn.disabled = true;
    let base = S.data.guests.map(r => parseInt(String(r.code || '').replace(/\D/g, ''), 10) || 0).reduce((a, b) => Math.max(a, b), 0);
    let n = 0;
    for (const g of parsed) { btn.textContent = `Importing ${n + 1} of ${parsed.length}…`; try { await saveRecord('guests', Object.assign({ code: 'G-' + String(++base).padStart(3, '0') }, g), { silent: true }); n++; } catch (e) { break; } }
    logActivity('added', 'guests', { id: '', name: `${n} guests from CSV`, updatedAt: new Date().toISOString() }, null, [], 'CSV import');
    m.close(true); toast(`${plural(n, 'guest')} imported`);
  };
}

/* ---------- boot ---------- */
async function boot() {
  showLock('loading');
  const cloud = new CloudStore();
  let r = 'absent';
  if (!window.FU_STANDALONE) { try { r = await cloud.init(); } catch (e) { r = 'unavailable'; } }
  if (r === 'ok') STORE = cloud;
  else {
    STORE = new LocalStore(); const lr = await STORE.init();
    MODE_NOTE = r === 'unavailable'
      ? '<b>Shared storage isn\'t available in this view,</b> so changes are saved on this device only and won\'t reach the other person. Reload the page, or open it from the claude.ai link while signed in.'
      : lr === 'memory' ? '<b>This browser is blocking storage,</b> so changes will be lost when you close the page. Use a normal (non-private) window.' : '';
  }
  COLLECTIONS.forEach(col => STORE.subscribe(col, (rows, meta) => {
    S.data[col] = rows; S.loaded.add(col);
    if (APP_VISIBLE) scheduleRender(); else paintSync();
  }, e => { SYNC.loadError = errMsg(e); paintSync(); if (e && e.code === 'revoked') toast('Access to this planner changed. Reload the page.', 'bad'); }));
  for (let i = 0; i < 100 && !S.loaded.has('meta'); i++) await sleep(100);
  if (!S.loaded.has('meta')) { SYNC.loadError = 'Still connecting to storage…'; }
  if (isUnlocked()) afterUnlock(); else showLock('pw');
  setInterval(() => { if (APP_VISIBLE && !modalStack.length && UI.page === 'dashboard') { ANIM = false; render(); } }, 5 * 60 * 1000); // keep countdown fresh
}
window.APP_READY = true;
boot();

</script>
